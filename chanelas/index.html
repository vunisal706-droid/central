<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16a34a">
<title>¿Chanelas? · Aprende caló</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--verde:#16a34a;--verde-o:#15803d;--azul:#2563eb;--azul-o:#1d4ed8;--rojo:#dc2626;--rojo-o:#b91c1c;--oro:#f59e0b;
--txt:#1f2937;--suave:#6b7280;--borde:#e5e7eb;--ok:#dcfce7;--mal:#fee2e2}
*{box-sizing:border-box;min-width:0}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:var(--txt);font-size:17px;min-height:100vh;
background:linear-gradient(180deg,#dbeafe 0%,#eff6ff 45%,#dcfce7 100%) fixed;overflow-x:clip}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:2px solid var(--borde)}
header img{height:42px;width:auto}
.marca{font-family:'Baloo 2',cursive;font-size:1.6rem;font-weight:800;color:var(--verde-o);line-height:1}
.marca small{display:block;font:700 .75rem 'Nunito';color:var(--suave)}
.stats{margin-left:auto;display:flex;gap:14px;font-weight:800;font-size:1.05rem}
.stats span{display:flex;align-items:center;gap:4px}
main{max-width:720px;margin:0 auto;padding:16px 16px 80px}
.aviso{background:#fef9c3;border:2px solid #fde68a;border-radius:16px;padding:10px 14px;font-size:.88rem;color:#713f12;margin-bottom:14px}
.unidad{border-radius:20px;padding:14px 18px;color:#fff;margin:22px 0 12px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.unidad h2{margin:0;font-family:'Baloo 2';font-size:1.3rem;line-height:1.1}
.unidad p{margin:2px 0 0;font-size:.9rem;opacity:.95}
.unidad .ico{font-size:2rem}
.camino{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0}
.nodo{width:78px;height:72px;border-radius:50%;border:none;font-size:1.9rem;cursor:pointer;color:#fff;position:relative;
box-shadow:0 7px 0 rgba(0,0,0,.22);transition:transform .1s,box-shadow .1s}
.nodo:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.nodo:focus-visible,.btn:focus-visible,.opc:focus-visible,.ficha:focus-visible{outline:4px solid var(--oro);outline-offset:3px}
.nodo.bloq{background:#d1d5db!important;color:#9ca3af;cursor:not-allowed;box-shadow:0 7px 0 #9ca3af}
.nodo .corona{position:absolute;right:-8px;top:-8px;font-size:1.1rem;background:#fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.nodo.actual::after{content:'¡Empieza!';position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:#fff;color:var(--verde-o);font:800 .85rem Nunito;padding:4px 10px;border-radius:10px;border:2px solid var(--borde);white-space:nowrap;animation:bote 1.4s infinite}
@keyframes bote{50%{transform:translate(-50%,-5px)}}
/* Lección */
.leccion{position:fixed;inset:0;background:#fff;z-index:20;display:none;flex-direction:column}
.leccion.on{display:flex}
.lcab{display:flex;align-items:center;gap:14px;padding:14px 16px;max-width:760px;width:100%;margin:0 auto}
.cerrar{background:none;border:none;font-size:1.6rem;cursor:pointer;color:var(--suave);min-width:44px;min-height:44px}
.barra{flex:1;height:18px;background:#e5e7eb;border-radius:999px;overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4ade80,var(--verde));border-radius:999px;transition:width .35s}
.vidas{font-weight:800;color:var(--rojo);font-size:1.1rem;white-space:nowrap}
.lcuerpo{flex:1;overflow-y:auto;padding:10px 16px;max-width:760px;width:100%;margin:0 auto}
.consigna{font-family:'Baloo 2';font-size:1.5rem;font-weight:800;margin:6px 0 16px;line-height:1.2}
.pregunta{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.bocadillo{border:2px solid var(--borde);border-radius:16px;padding:12px 18px;font-size:1.35rem;font-weight:800;position:relative;background:#fff}
.audio{background:var(--azul);color:#fff;border:none;border-radius:14px;width:54px;height:54px;font-size:1.5rem;cursor:pointer;box-shadow:0 4px 0 var(--azul-o);flex:none}
.audio.grande{width:110px;height:110px;font-size:3rem;border-radius:24px;box-shadow:0 6px 0 var(--azul-o)}
.opciones{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.opc{background:#fff;border:2px solid var(--borde);border-bottom-width:5px;border-radius:16px;padding:14px;font:800 1.15rem Nunito;color:var(--txt);cursor:pointer;min-height:64px;text-align:center}
.opc .em{display:block;font-size:2.4rem;margin-bottom:4px}
.opc.sel{border-color:#60a5fa;background:#eff6ff;color:var(--azul-o)}
.opc.ok{border-color:#4ade80;background:var(--ok);color:#166534}
.opc.mal{border-color:#f87171;background:var(--mal);color:#991b1b}
.opc.hecho{opacity:.35;pointer-events:none}
.pares{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pares .col{display:flex;flex-direction:column;gap:10px}
.zona{min-height:68px;border-bottom:2px solid var(--borde);border-top:2px solid var(--borde);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.banco{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.ficha{background:#fff;border:2px solid var(--borde);border-bottom-width:4px;border-radius:12px;padding:9px 14px;font:800 1.1rem Nunito;cursor:pointer;color:var(--txt);min-height:46px}
.ficha.usada{visibility:hidden}
.escribir{width:100%;font:800 1.3rem Nunito;padding:14px;border:2px solid var(--borde);border-radius:16px;background:#f9fafb;color:var(--txt)}
.tarjeta{text-align:center;padding:10px}
.tarjeta .em{font-size:5rem}
.tarjeta .cal{font-family:'Baloo 2';font-size:2.8rem;font-weight:800;color:var(--verde-o);line-height:1}
.tarjeta .sig{font-size:1.3rem;font-weight:700;color:var(--suave);margin-top:4px}
.tarjeta .ej{margin-top:14px;font-size:1.05rem;background:#f0fdf4;border-radius:14px;padding:10px 14px;display:inline-block}
.lpie{border-top:2px solid var(--borde);padding:16px;transition:background .2s}
.lpie .dentro{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lpie.ok{background:var(--ok)}.lpie.mal{background:var(--mal)}
.feedback{flex:1;font-weight:800;font-size:1.15rem}
.lpie.ok .feedback{color:#166534}.lpie.mal .feedback{color:#991b1b}
.feedback small{display:block;font-weight:700;font-size:.95rem}
.btn{background:var(--verde);color:#fff;border:none;border-radius:16px;padding:14px 26px;font:800 1.1rem Nunito;cursor:pointer;box-shadow:0 5px 0 var(--verde-o);min-height:54px;min-width:160px;letter-spacing:.02em}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--verde-o)}
.btn:disabled{background:#d1d5db;box-shadow:0 5px 0 #9ca3af;cursor:not-allowed}
.btn.rojo{background:var(--rojo);box-shadow:0 5px 0 var(--rojo-o)}
.btn.sec{background:#fff;color:var(--azul);border:2px solid var(--borde);box-shadow:0 4px 0 var(--borde)}
.fin{text-align:center;padding:30px 10px}
.fin h2{font-family:'Baloo 2';font-size:2rem;margin:10px 0;color:var(--verde-o)}
.kpis{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.kpi{border:2px solid var(--borde);border-radius:16px;padding:10px 18px;min-width:110px}
.kpi b{display:block;font-size:1.6rem}
.chani{width:120px;height:120px}
.chani.peq{width:70px;height:70px;flex:none}
.anima{animation:salto .5s ease}
@keyframes salto{40%{transform:translateY(-14px) scale(1.05)}}
.sacude{animation:sac .35s}
@keyframes sac{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#confeti{position:fixed;inset:0;pointer-events:none;z-index:30}
.pie{text-align:center;font-size:.8rem;color:var(--suave);margin-top:30px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const NO_CALO=['mesa','ventana','libro','camino','flor','árbol','silla','campo','montaña','zapato','pelota','cuaderno'];
const LECC_POR_UNIDAD=3, EJ_POR_LECCION=10;

/* ================== PROGRESO ================== */
const K='chanelas-v1';let S={hechas:{},xp:0,racha:0,ultimo:'',vistas:{}};
try{const g=localStorage.getItem(K);if(g)S=Object.assign(S,JSON.parse(g));}catch(e){}
const guardar=()=>{try{localStorage.setItem(K,JSON.stringify(S));}catch(e){}};
const hoy=()=>new Date().toISOString().slice(0,10);
function pintarStats(){const ay=new Date(Date.now()-864e5).toISOString().slice(0,10);if(S.ultimo&&S.ultimo!==hoy()&&S.ultimo!==ay){S.racha=0;}
  document.getElementById('sRacha').textContent=S.racha;document.getElementById('sXp').textContent=S.xp;}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mezclar=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const azar=a=>a[Math.floor(Math.random()*a.length)];
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[¡!¿?.,]/g,'').replace(/\s+/g,' ').trim();

/* ================== MASCOTA (original) ================== */
const CHANI=`<svg class="chani CLS" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="64" r="46" fill="#16a34a"/><circle cx="60" cy="64" r="46" fill="url(#lun)"/>
<defs><pattern id="lun" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="3.2" fill="#bbf7d0"/></pattern></defs>
<ellipse cx="60" cy="70" rx="30" ry="26" fill="#fff"/><circle cx="48" cy="64" r="6" fill="#1f2937"/><circle cx="72" cy="64" r="6" fill="#1f2937"/><circle cx="50" cy="62" r="2" fill="#fff"/><circle cx="74" cy="62" r="2" fill="#fff"/>
<path d="M50 78 Q60 88 70 78" stroke="#1f2937" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="40" cy="76" r="4" fill="#fca5a5"/><circle cx="80" cy="76" r="4" fill="#fca5a5"/>
<g transform="translate(86 24)"><circle r="9" fill="#dc2626"/><circle cx="-8" cy="-4" r="7" fill="#ef4444"/><circle cx="6" cy="-8" r="7" fill="#ef4444"/><circle cx="8" cy="6" r="7" fill="#ef4444"/><circle cx="-6" cy="8" r="7" fill="#ef4444"/><circle r="4" fill="#fde047"/></g></svg>`;
const chani=(cls='')=>CHANI.replace('CLS',cls);

/* ================== MAPA ================== */
function pintarMapa(){pintarStats();let html=`<div class="aviso">📚 Vocabulario de caló documentado en diccionarios. <b>En revisión:</b> si conoces otra forma de decirlo, ¡cuéntaselo a tu maestro o maestra!</div>`;
  let siguiente=true;
  UNIDADES.forEach((u,ui)=>{html+=`<div class="unidad" style="background:${u.col}"><span class="ico" aria-hidden="true">${u.ico}</span><div><h2>Unidad ${ui+1} · ${esc(u.t)}</h2><p>${esc(u.d)}</p></div></div><div class="camino">`;
    for(let l=0;l<LECC_POR_UNIDAD;l++){const id=u.id+'-'+l,hecha=S.hechas[id],abierta=hecha||siguiente,actual=!hecha&&siguiente;if(actual)siguiente=false;
      const off=[0,-60,60][l%3];
      html+=`<button class="nodo ${abierta?'':'bloq'} ${actual?'actual':''}" style="background:${u.col};margin-left:${off}px" data-u="${ui}" data-l="${l}" ${abierta?'':'disabled'} aria-label="Unidad ${ui+1}, lección ${l+1}${hecha?', completada':abierta?'':', bloqueada'}">${abierta?(['⭐','🎧','🏆'][l]):'🔒'}${hecha?'<span class="corona">👑</span>':''}</button>`;}
    html+='</div>';});
  html+=`<p class="pie">¿Chanelas? · CEIP Capitulaciones · Para aprender y respetar la cultura gitana</p>`;
  $('#mapa').innerHTML=html;
  const act=document.querySelector('.nodo.actual');if(act&&!pintarMapa.hecho){pintarMapa.hecho=1;setTimeout(()=>act.scrollIntoView({block:'center',behavior:'smooth'}),300);}}
$('#mapa').onclick=e=>{const n=e.target.closest('.nodo');if(n&&!n.disabled)empezar(+n.dataset.u,+n.dataset.l);};

/* ================== VOZ Y SONIDOS ================== */
function hablar(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.8;const v=speechSynthesis.getVoices().find(v=>/^es(-|_)ES/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}}
let AC;function son(tipo){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const notas=tipo==='ok'?[660,880]:tipo==='fin'?[523,659,784,1047]:[220,170];
  notas.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=tipo==='mal'?'sawtooth':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,AC.currentTime+i*.12);g.gain.exponentialRampToValueAtTime(.18,AC.currentTime+i*.12+.02);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+i*.12+.2);o.connect(g).connect(AC.destination);o.start(AC.currentTime+i*.12);o.stop(AC.currentTime+i*.12+.22);});}catch(e){}}

/* ================== LECCIÓN ================== */
let L=null;
function empezar(ui,l){const u=UNIDADES[ui];const cola=[];
  const palabras=u.w.map(w=>({c:w[0],e:w[1],i:w[2]}));
  // Palabras nuevas: se presentan antes de preguntarlas
  if(l===0)palabras.forEach(p=>{if(!S.vistas[p.c])cola.push({tipo:'nueva',p});});
  const tipos=u.especial?['origen','origen','significado','acalo','origen','pares']:
    l===0?['significado','significado','acalo','escucha','pares']:l===1?['acalo','escucha','pares','frase','significado','escribir']:['escribir','frase','escucha','acalo','pares','frase'];
  while(cola.filter(x=>x.tipo!=='nueva').length<EJ_POR_LECCION){const t=azar(tipos);if(t==='frase'&&!u.f.length)continue;cola.push({tipo:t,p:azar(palabras)});}
  L={ui,l,u,palabras,cola,i:0,vidas:5,errores:0,total:cola.length,fallos:[]};
  $('#leccion').classList.add('on');document.body.style.overflow='hidden';siguienteEj();}
function salir(){$('#leccion').classList.remove('on');document.body.style.overflow='';speechSynthesis&&speechSynthesis.cancel();L=null;pintarMapa();}
$('#bCerrar').onclick=()=>{if(!L||L.i<2||confirmar())salir();};
let confirmando=false;function confirmar(){if(confirmando)return true;confirmando=true;$('#feedback').innerHTML='¿Seguro que quieres salir? Perderás el progreso de esta lección. <small>Pulsa ✕ otra vez para salir.</small>';setTimeout(()=>{confirmando=false;},3000);return false;}
document.addEventListener('keydown',e=>{if(!L)return;if(e.key==='Escape')$('#bCerrar').click();if(e.key==='Enter'&&!$('#bComprobar').disabled)$('#bComprobar').click();});

let comprobar=null,estado='responder';
function siguienteEj(){const ej=L.cola[L.i];estado='responder';
  $('#progreso').style.width=(L.i/L.cola.length*100)+'%';$('#vidas').textContent='❤️ '+L.vidas;
  const pie=$('#pie');pie.className='lpie';$('#feedback').textContent='';const b=$('#bComprobar');b.textContent='COMPROBAR';b.disabled=true;b.className='btn';
  ({nueva:ejNueva,significado:ejSignificado,acalo:ejACalo,escucha:ejEscucha,pares:ejPares,frase:ejFrase,escribir:ejEscribir,origen:ejOrigen})[ej.tipo](ej);}
function listo(fn){comprobar=fn;$('#bComprobar').disabled=false;}
$('#bComprobar').onclick=()=>{if(estado==='responder'&&comprobar){comprobar();}else if(estado==='continuar'){L.i++;if(L.vidas<=0)return sinVidas();if(L.i>=L.cola.length)return finLeccion();siguienteEj();}};
function resultado(bien,solucion,extra){estado='continuar';const pie=$('#pie');pie.className='lpie '+(bien?'ok':'mal');
  if(bien){son('ok');$('#feedback').innerHTML=azar(['¡Chipén! 🎉','¡Muy bien!','¡Eso es chachipé!','¡Olé! 👏'])+(extra?`<small>${extra}</small>`:'');}
  else{son('mal');L.vidas--;L.errores++;$('#vidas').textContent='❤️ '+L.vidas;$('#ejercicio').classList.add('sacude');setTimeout(()=>$('#ejercicio').classList.remove('sacude'),400);
    $('#feedback').innerHTML=`Respuesta correcta:<small>${esc(solucion)}</small>`;
    const ej=L.cola[L.i];if(ej.tipo!=='nueva'&&L.cola.length<L.total+6)L.cola.push({...ej});}
  const b=$('#bComprobar');b.textContent='CONTINUAR';b.disabled=false;b.className='btn'+(bien?'':' rojo');b.focus();}
function cab(texto,conChani=true){return `<div class="consigna">${texto}</div>`;}
function opcionesPalabra(p,campo,n=4){const vistos=new Set([p.c,p.e]),otras=[];for(const x of mezclar(UNIDADES.flatMap(u=>u.w.map(w=>({c:w[0],e:w[1],i:w[2]}))))){if(vistos.has(x.c)||vistos.has(x.e))continue;vistos.add(x.c);vistos.add(x.e);otras.push(x);if(otras.length>=n-1)break;}return mezclar([p,...otras]);}

function ejNueva({p}){$('#ejercicio').innerHTML=`${cab('Palabra nueva ✨')}<div class="tarjeta anima"><div class="em" aria-hidden="true">${p.i}</div><div class="cal">${esc(p.c)}</div><div class="sig">${esc(p.e)}</div>
  <p><button class="audio" id="aud" aria-label="Escuchar la palabra">🔊</button></p></div>`;$('#aud').onclick=()=>hablar(p.c);hablar(p.c);
  S.vistas[p.c]=1;estado='continuar';const b=$('#bComprobar');b.textContent='CONTINUAR';b.disabled=false;b.focus();}
function ejSignificado({p}){const op=opcionesPalabra(p,'c');let sel=null;
  $('#ejercicio').innerHTML=`${cab('¿Qué significa?')}<div class="pregunta">${chani('peq')}<div class="bocadillo">${esc(p.c)}</div><button class="audio" id="aud" aria-label="Escuchar">🔊</button></div>
  <div class="opciones">${op.map((o,k)=>`<button class="opc" data-k="${k}"><span class="em" aria-hidden="true">${o.i}</span>${esc(o.e)}</button>`).join('')}</div>`;
  $('#aud').onclick=()=>hablar(p.c);hablar(p.c);
  elegir(op,k=>{sel=k;listo(()=>{const bien=op[sel].c===p.c;marcar(sel,op.findIndex(o=>o.c===p.c),bien);resultado(bien,`${p.c} = ${p.e}`);});});}
function ejACalo({p}){const op=opcionesPalabra(p,'e');let sel=null;
  $('#ejercicio').innerHTML=`${cab(`¿Cómo se dice <u>${esc(p.e)}</u> en caló?`)}<div class="pregunta"><div style="font-size:3.4rem" aria-hidden="true">${p.i}</div></div>
  <div class="opciones">${op.map((o,k)=>`<button class="opc" data-k="${k}">${esc(o.c)}</button>`).join('')}</div>`;
  elegir(op,k=>{sel=k;hablar(op[k].c);listo(()=>{const bien=op[sel].c===p.c;marcar(sel,op.findIndex(o=>o.c===p.c),bien);resultado(bien,`${p.e} = ${p.c}`);});});}
function ejEscucha({p}){const op=opcionesPalabra(p,'c',3);let sel=null;
  $('#ejercicio').innerHTML=`${cab('Escucha y elige lo que oyes')}<div class="pregunta" style="justify-content:center"><button class="audio grande" id="aud" aria-label="Escuchar otra vez">🔊</button></div>
  <div class="opciones">${op.map((o,k)=>`<button class="opc" data-k="${k}">${esc(o.c)}</button>`).join('')}</div>`;
  $('#aud').onclick=()=>hablar(p.c);setTimeout(()=>hablar(p.c),300);
  elegir(op,k=>{sel=k;listo(()=>{const bien=op[sel].c===p.c;marcar(sel,op.findIndex(o=>o.c===p.c),bien);resultado(bien,`${p.c} (${p.e})`);});});}
function ejEscribir({p}){$('#ejercicio').innerHTML=`${cab(`Escribe en caló: <u>${esc(p.e)}</u>`)}<div class="pregunta">${chani('peq')}<div style="font-size:3rem" aria-hidden="true">${p.i}</div></div>
  <label for="esc" class="consigna" style="font-size:1rem;margin:0 0 6px;display:block">Tu respuesta</label><input id="esc" class="escribir" autocomplete="off" autocapitalize="off" spellcheck="false">`;
  const inp=$('#esc');inp.focus();inp.oninput=()=>{if(inp.value.trim())listo(()=>{const bien=norm(inp.value)===norm(p.c);resultado(bien,p.c,bien&&inp.value.trim()!==p.c?`Se escribe: ${p.c}`:'');});else $('#bComprobar').disabled=true;};}
function ejPares(){const ps=mezclar(L.palabras).slice(0,Math.min(4,L.palabras.length));const izq=mezclar(ps),der=mezclar(ps);let a=null,hechos=0,fallo=false;
  $('#ejercicio').innerHTML=`${cab('Empareja las parejas')}<div class="pares"><div class="col">${izq.map(p=>`<button class="opc" data-lado="c" data-v="${esc(p.c)}">${esc(p.c)}</button>`).join('')}</div>
  <div class="col">${der.map(p=>`<button class="opc" data-lado="e" data-v="${esc(p.c)}"><span aria-hidden="true">${p.i}</span> ${esc(p.e)}</button>`).join('')}</div></div>`;
  $('#ejercicio').querySelector('.pares').onclick=e=>{const b=e.target.closest('.opc');if(!b||b.classList.contains('hecho'))return;if(b.dataset.lado==='c')hablar(b.dataset.v);
    if(!a||a.dataset.lado===b.dataset.lado){a&&a.classList.remove('sel');a=b;b.classList.add('sel');return;}
    if(a.dataset.v===b.dataset.v){[a,b].forEach(x=>{x.classList.remove('sel');x.classList.add('ok');setTimeout(()=>x.classList.add('hecho'),250);});son('ok');hechos++;a=null;
      if(hechos===ps.length){estado='responder';comprobar=null;setTimeout(()=>resultado(true,'',''),300);}}
    else{[a,b].forEach(x=>{x.classList.add('mal');setTimeout(()=>x.classList.remove('mal','sel'),400);});son('mal');if(!fallo){fallo=true;}a=null;}};}
function ejFrase(){const [cal,cas]=azar(L.u.f);const haciaCast=Math.random()<.5;const sol=haciaCast?cas:cal,mostrar=haciaCast?cal:cas;
  const palabrasSol=sol.split(' ');const extra=mezclar(L.palabras.map(p=>haciaCast?p.e.split(/[ ,(]/)[0]:p.c)).filter(x=>x&&!palabrasSol.map(norm).includes(norm(x))).slice(0,3);
  const fichas=mezclar([...palabrasSol,...extra]);const elegidas=[];
  $('#ejercicio').innerHTML=`${cab(haciaCast?'Traduce al castellano':'Traduce al caló')}<div class="pregunta">${chani('peq')}<div class="bocadillo">${esc(mostrar)}</div>${haciaCast?'<button class="audio" id="aud" aria-label="Escuchar">🔊</button>':''}</div>
  <div class="zona" id="zona" aria-label="Tu frase"></div><div class="banco" id="banco">${fichas.map((f,k)=>`<button class="ficha" data-k="${k}">${esc(f)}</button>`).join('')}</div>`;
  if(haciaCast){$('#aud').onclick=()=>hablar(cal);hablar(cal);}
  const pintarZona=()=>{$('#zona').innerHTML=elegidas.map((k,j)=>`<button class="ficha" data-j="${j}">${esc(fichas[k])}</button>`).join('');
    document.querySelectorAll('#banco .ficha').forEach(b=>b.classList.toggle('usada',elegidas.includes(+b.dataset.k)));
    if(elegidas.length)listo(()=>{const resp=elegidas.map(k=>fichas[k]).join(' ');const bien=norm(resp)===norm(sol);resultado(bien,sol);});else $('#bComprobar').disabled=true;};
  $('#banco').onclick=e=>{const b=e.target.closest('.ficha');if(!b||estado!=='responder')return;elegidas.push(+b.dataset.k);if(!haciaCast)hablar(fichas[+b.dataset.k]);pintarZona();};
  $('#zona').onclick=e=>{const b=e.target.closest('.ficha');if(!b||estado!=='responder')return;elegidas.splice(+b.dataset.j,1);pintarZona();};}
function ejOrigen({p}){const op=mezclar([{c:p.c,i:'🎁'},...mezclar(NO_CALO).slice(0,2).map(c=>({c,i:'📘'}))]);let sel=null;
  $('#ejercicio').innerHTML=`${cab('¿Cuál de estas palabras viene del caló?')}<div class="pregunta">${chani('peq')}<div class="bocadillo">Una de ellas nos la regaló el pueblo gitano</div></div>
  <div class="opciones">${op.map((o,k)=>`<button class="opc" data-k="${k}">${esc(o.c)}</button>`).join('')}</div>`;
  elegir(op,k=>{sel=k;listo(()=>{const bien=op[sel].c===p.c;marcar(sel,op.findIndex(o=>o.c===p.c),bien);resultado(bien,`«${p.c}» viene del caló y significa ${p.e}`,bien?`«${p.c}» significa ${p.e}`:'');});});}
function elegir(op,fn){$('#ejercicio').querySelector('.opciones').onclick=e=>{const b=e.target.closest('.opc');if(!b||estado!=='responder')return;document.querySelectorAll('.opciones .opc').forEach(x=>x.classList.toggle('sel',x===b));fn(+b.dataset.k);};}
function marcar(sel,ok,bien){const bs=document.querySelectorAll('.opciones .opc');bs[ok]&&bs[ok].classList.add('ok');if(!bien)bs[sel].classList.add('mal');}

function finLeccion(){$('#progreso').style.width='100%';son('fin');confeti();
  const id=L.u.id+'-'+L.l,xp=10+Math.max(0,5-L.errores)*2;const primera=!S.hechas[id];S.hechas[id]=1;S.xp+=xp;
  if(S.ultimo!==hoy()){const ay=new Date(Date.now()-864e5).toISOString().slice(0,10);S.racha=S.ultimo===ay?S.racha+1:1;S.ultimo=hoy();}guardar();
  const prec=Math.round((L.total-Math.min(L.errores,L.total))/L.total*100);
  $('#ejercicio').innerHTML=`<div class="fin">${chani('anima')}<h2>${primera?'¡Lección completada!':'¡Repaso completado!'}</h2><p>¡Ya chanelas un poco más de caló!</p>
  <div class="kpis"><div class="kpi">⭐<b>+${xp}</b>puntos</div><div class="kpi">🎯<b>${prec}%</b>aciertos</div><div class="kpi">🔥<b>${S.racha}</b>${S.racha===1?'día':'días'}</div></div></div>`;
  $('#pie').className='lpie';$('#feedback').textContent='';const b=$('#bComprobar');b.textContent='CONTINUAR';b.disabled=false;b.className='btn';estado='fin';b.onclick=()=>{b.onclick=null;$('#bComprobar').onclick=handler;salir();};}
const handler=$('#bComprobar').onclick;
function sinVidas(){$('#ejercicio').innerHTML=`<div class="fin"><div style="font-size:4rem">💔</div><h2 style="color:var(--rojo)">¡Te has quedado sin vidas!</h2><p>No pasa nada: repasar es la mejor forma de aprender.</p></div>`;
  $('#pie').className='lpie';$('#feedback').textContent='';const b=$('#bComprobar');b.textContent='VOLVER A INTENTARLO';b.className='btn';b.disabled=false;estado='fin';
  b.onclick=()=>{b.onclick=handler;const {ui,l}=L;empezar(ui,l);};}

/* ================== CONFETI ================== */
function confeti(){const c=$('#confeti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const ps=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.4,v:2+Math.random()*4,r:Math.random()*6.28,s:6+Math.random()*6,col:azar(['#16a34a','#2563eb','#dc2626','#f59e0b','#db2777'])}));let t=0;
  (function paso(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.y/30);p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.col;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});if(++t<160)requestAnimationFrame(paso);else x.clearRect(0,0,c.width,c.height);})();}

if('speechSynthesis' in window)speechSynthesis.getVoices();
pintarMapa();
}
</script>
