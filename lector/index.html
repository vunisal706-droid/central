<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>Lector+ · Perfil y fluidez lectora</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --color-primary:#2563eb;--color-primary-light:#dbeafe;--color-primary-dark:#1d4ed8;--color-secondary:#7c3aed;
  --color-bg:#ffffff;--color-surface:#ffffff;--color-border:#e2e8f0;--color-text:#1e293b;--color-text-muted:#64748b;
  --color-success:#16a34a;--color-success-bg:#dcfce7;--color-error:#dc2626;--color-error-bg:#fee2e2;
  --color-warning:#d97706;--color-warning-bg:#fef3c7;--color-info:#0891b2;--color-info-bg:#e0f2fe;
  --radius-md:10px;--radius-lg:16px;--radius-xl:24px;
  --shadow-card:0 2px 8px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.04);--shadow-lg:0 8px 24px rgba(0,0,0,.12);
  --font:'Plus Jakarta Sans',system-ui,sans-serif;--font-read:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);color:var(--color-text);font-size:15px;
  background:linear-gradient(120deg,#e0f2fe,#ede9fe,#dcfce7,#fef9c3,#e0f2fe);background-size:400% 400%;animation:fondo 30s ease infinite}
@keyframes fondo{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--color-border);position:sticky;top:0;z-index:10;flex-wrap:wrap}
header img{height:52px;width:auto}
header h1{font-size:1.25rem;margin:0;font-weight:800;color:var(--color-primary-dark)}
header .sub{font-size:.8rem;color:var(--color-text-muted)}
.alsel{margin-left:auto;display:flex;align-items:center;gap:8px}
nav{display:flex;gap:6px;padding:10px 20px;flex-wrap:wrap}
nav button{background:rgba(255,255,255,.8);border:1px solid var(--color-border);border-radius:999px;padding:9px 16px;font:600 .92rem var(--font);color:var(--color-text);cursor:pointer;min-height:42px}
nav button.on{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}
main{max-width:1050px;margin:0 auto;padding:8px 20px 60px}
.card{background:rgba(255,255,255,.92);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:22px;margin-bottom:16px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{margin:0 0 6px;font-size:1.3rem}h3{margin:14px 0 8px;font-size:1.05rem}
p.muted,.muted{color:var(--color-text-muted)}
.btn{background:var(--color-primary);color:#fff;border:none;border-radius:var(--radius-md);padding:11px 20px;font:600 .95rem var(--font);cursor:pointer;min-height:44px;transition:background .15s,transform .1s}
.btn:hover{background:var(--color-primary-dark)}.btn:active{transform:scale(.97)}
.btn:focus-visible,nav button:focus-visible{outline:3px solid var(--color-primary);outline-offset:3px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--color-primary);border:1.5px solid var(--color-primary)}
.btn.verde{background:var(--color-success)}.btn.rojo{background:var(--color-error)}
.btn.big{font-size:1.15rem;padding:16px 28px}
.fila{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label{font-weight:600;font-size:.88rem;display:block;margin-bottom:4px}
input,select,textarea{font:500 .95rem var(--font);padding:10px 12px;border:1.5px solid var(--color-border);border-radius:var(--radius-md);background:#fff;color:var(--color-text);min-height:44px}
textarea{width:100%;min-height:120px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--color-border)}
th{color:var(--color-text-muted);font-weight:600;font-size:.82rem;text-transform:uppercase;letter-spacing:.03em}
tr:nth-child(even) td{background:#f8fafc}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-weight:700;font-size:.85rem}
.ok{background:var(--color-success-bg);color:#166534}.med{background:var(--color-warning-bg);color:#92400e}.mal{background:var(--color-error-bg);color:#991b1b}.inf{background:var(--color-info-bg);color:#155e75}
.pasos{display:flex;gap:8px;margin:6px 0 16px;flex-wrap:wrap}
.paso{padding:6px 12px;border-radius:999px;background:#f1f5f9;color:var(--color-text-muted);font-weight:600;font-size:.85rem}
.paso.on{background:var(--color-primary-light);color:var(--color-primary-dark)}.paso.hecho{background:var(--color-success-bg);color:#166534}
/* Zona de lectura (la ve el alumno) */
.lectura{font-family:var(--font-read);font-size:1.7rem;line-height:2.1;background:#fffdf7;border:2px solid #fde68a;border-radius:var(--radius-xl);padding:22px 26px;margin:12px 0;user-select:none}
.lectura.peq{font-size:1.45rem}
.w{display:inline-block;padding:0 4px;margin:0 1px;border-radius:8px;cursor:pointer;transition:background .1s}
.w:hover{background:#f1f5f9}
.w.err{background:var(--color-error-bg);color:#b91c1c;text-decoration:line-through;text-decoration-thickness:2px}
.w.ult{outline:3px solid var(--color-primary);background:var(--color-primary-light)}
.w.fuera{opacity:.35}
.w.leyendo{background:#fde68a}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:14px 0}
.item{font-family:var(--font-read);font-size:1.8rem;font-weight:800;text-align:center;padding:16px 8px;border-radius:var(--radius-lg);background:#fffdf7;border:2px solid #fde68a;cursor:pointer;user-select:none}
.item.err{background:var(--color-error-bg);border-color:#fca5a5;color:#b91c1c;text-decoration:line-through}
.reloj{font-size:2.2rem;font-weight:800;color:var(--color-primary-dark);font-variant-numeric:tabular-nums;min-width:110px}
.reloj.fin{color:var(--color-error)}
.aviso{padding:12px 16px;border-radius:var(--radius-md);background:var(--color-info-bg);color:#155e75;font-size:.92rem;margin:10px 0}
.aviso.am{background:var(--color-warning-bg);color:#92400e}
.opcion{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--color-border);border-radius:var(--radius-md);padding:14px 16px;margin:8px 0;font:600 1.1rem var(--font-read);cursor:pointer;color:var(--color-text)}
.opcion.sel{border-color:var(--color-primary);background:var(--color-primary-light)}
.perfil{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:12px 0}
.kpi{border-radius:var(--radius-lg);padding:16px;border:1px solid var(--color-border);background:#fff}
.kpi .n{font-size:1.9rem;font-weight:800}
.kpi .t{font-size:.85rem;color:var(--color-text-muted);font-weight:600}
.conclusion{border-left:5px solid var(--color-primary);background:var(--color-primary-light);padding:14px 18px;border-radius:var(--radius-md);margin:12px 0}
.barras{display:flex;align-items:flex-end;gap:22px;height:220px;padding:10px 6px;border-bottom:2px solid var(--color-border);margin:14px 0}
.barra{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.barra .b{width:100%;border-radius:12px 12px 4px 4px;background:linear-gradient(180deg,#60a5fa,#2563eb);transition:height .6s ease;min-height:4px}
.barra .v{font-weight:800;font-size:1.2rem;margin-bottom:4px}
.barra .l{font-size:.85rem;color:var(--color-text-muted);margin-top:6px}
#toast{position:fixed;bottom:24px;right:24px;background:#fff;border-left:4px solid var(--color-success);border-radius:var(--radius-md);padding:14px 20px;box-shadow:var(--shadow-lg);z-index:99;max-width:380px;display:none;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.35);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .card{max-width:520px;width:100%}
footer{text-align:center;font-size:.78rem;color:var(--color-text-muted);padding:20px}
@media (max-width:640px){.lectura{font-size:1.35rem;padding:16px}.item{font-size:1.4rem}header img{height:40px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media print{nav,header .alsel,.noprint{display:none!important}body{background:#fff;animation:none}.card{box-shadow:none;border:1px solid #ddd}}
</style>
</head>

4:{t:'La tormenta',x:'Aquella tarde el cielo se puso de color gris oscuro. Daniel y su abuela estaban en el campo recogiendo aceitunas cuando empezó a soplar un viento frío. —Vamos al cortijo, que viene tormenta —dijo la abuela mientras miraba las nubes. Daniel quería terminar de llenar el cubo, pero de pronto se oyó un trueno tan fuerte que hizo temblar el suelo. Corrieron por el camino de tierra mientras caían las primeras gotas, gordas como garbanzos. Cuando llegaron, estaban empapados. La abuela encendió la chimenea y preparó dos tazas de chocolate caliente. Desde la ventana vieron cómo los relámpagos iluminaban los olivos. —¿Ves? —dijo la abuela—. Las aceitunas pueden esperar, pero nosotros no. Daniel sonrió y pensó que la tormenta no había sido tan mala.',

/* ================== UTILIDADES DE TEXTO ================== */
function palabras(txt){return txt.split(/\s+/).filter(w=>/[\p{L}\p{N}]/u.test(w));}
function htmlPalabras(txt){return palabras(txt).map((w,i)=>`<span class="w" data-i="${i}">${esc(w)}</span>`).join(' ');}
function hablar(txt,onWord,onEnd){
  if(!('speechSynthesis' in window)){toast('Este navegador no puede leer en voz alta','err');onEnd&&onEnd();return;}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='es-ES';u.rate=.85;
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith('es-ES'))||speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith('es'));if(v)u.voice=v;
  // Mapa de carácter -> índice de palabra
  const mapa=[];let idx=-1,enPal=false;for(let c=0;c<txt.length;c++){const s=/\s/.test(txt[c]);if(!s&&!enPal){enPal=true;idx++;}if(s)enPal=false;mapa[c]=idx;}
  u.onboundary=e=>{if(e.name==='word'||e.name===undefined){onWord&&onWord(mapa[e.charIndex]);}};
  u.onend=()=>onEnd&&onEnd();speechSynthesis.speak(u);
}
if('speechSynthesis' in window)speechSynthesis.getVoices();

}

function ir(v){vistaAct=v;speechSynthesis&&speechSynthesis.cancel();clearInterval(T.id);

  pintarSelector();({alumnado:vAlumnado,evaluar:vEvaluar,entrenar:vEntrenar,seguimiento:vSeguimiento,base:vBase,ajustes:vAjustes})[v]();window.scrollTo(0,0);}
function sinAlumno(){$('#vista').innerHTML=`<div class="card"><h2>Primero, elige un alumno o alumna</h2><p class="muted">Añádelo en la pestaña Alumnado y selecciónalo arriba a la derecha.</p><button class="btn" onclick="ir('alumnado')">Ir a Alumnado</button></div>`;}

/* ================== CRONÓMETRO ================== */
const T={id:null,ini:0,seg:0};
function arrancar(onTick,limite,onFin){T.ini=performance.now();clearInterval(T.id);T.id=setInterval(()=>{T.seg=(performance.now()-T.ini)/1000;onTick(T.seg);if(limite&&T.seg>=limite){clearInterval(T.id);T.seg=limite;onFin&&onFin();}},100);}
function parar(){clearInterval(T.id);T.seg=(performance.now()-T.ini)/1000;return T.seg;}
const mmss=s=>{s=Math.max(0,s);return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;};

/* ================== PERFIL LECTOR ================== */
let EV=null;
function vEvaluar(){const a=alumno();if(!a)return sinAlumno();
  EV={al:a.id,curso:a.curso,f:hoy(),paso:0};
  $('#vista').innerHTML=`<div class="card"><h2>Perfil lector · ${esc(a.clave)} (${a.curso}.º)</h2>
  <p class="muted">Tres pruebas cortas (unos 10 minutos). Tú marcas los errores tocando la palabra; el alumno o alumna solo lee.</p>
  <div class="pasos" id="pasos"></div><div id="paso"></div></div>`;pruebaPalabras('pal');}
function pintarPasos(n){const nom=['Palabras','Pseudopalabras','Fluidez (1 min)','Comprensión','Resultado'];
  $('#pasos').innerHTML=nom.map((x,i)=>`<span class="paso ${i===n?'on':i<n?'hecho':''}">${i<n?'✓ ':''}${x}</span>`).join('');}

function pruebaPalabras(tipo){
  const L=listaDe(EV.curso)[tipo],n=tipo==='pal'?0:1;pintarPasos(n);
  const errs=new Set();
  $('#paso').innerHTML=`<h3>${tipo==='pal'?'1. Lectura de palabras':'2. Lectura de pseudopalabras (palabras inventadas)'}</h3>
  <p class="muted">${tipo==='pal'?'Mide el reconocimiento de palabras reales.':'Las pseudopalabras no se pueden adivinar: obligan a descifrar letra a letra (ruta fonológica).'} Pulsa <b>Empezar</b>, que lea en orden y toca las que lea mal. Pulsa <b>Terminado</b> cuando acabe.</p>
  <div class="fila"><button class="btn big verde" id="go">▶ Empezar</button><span class="reloj" id="rel">0:00</span><button class="btn big" id="fin" disabled>■ Terminado</button></div>
  <div class="rejilla" id="rej" style="filter:blur(6px)">${L.map((w,i)=>`<div class="item" data-i="${i}">${w}</div>`).join('')}</div>`;
  $('#rej').onclick=e=>{const it=e.target.closest('.item');if(!it||$('#fin').disabled)return;const i=+it.dataset.i;errs.has(i)?errs.delete(i):errs.add(i);it.classList.toggle('err');};
  $('#go').onclick=()=>{$('#rej').style.filter='none';$('#go').disabled=true;$('#fin').disabled=false;arrancar(s=>$('#rel').textContent=mmss(s));};
  $('#fin').onclick=()=>{const s=parar();$('#fin').disabled=true;
    EV[tipo]={total:L.length,aciertos:L.length-errs.size,seg:Math.round(s*10)/10,errores:[...errs].map(i=>L[i])};
    tipo==='pal'?pruebaPalabras('ps'):pruebaFluidez();};
}

function pruebaFluidez(){pintarPasos(2);const tx=EVAL[EV.curso];EV.texto=tx.t;
  let fase='antes',ult=null,segFin=60;const errs=new Set();
  $('#paso').innerHTML=`<h3>3. Fluidez: lectura de un texto durante 1 minuto</h3>
  <p class="muted">Pulsa <b>Empezar</b>: el texto aparece y empieza el minuto. Toca las palabras que lea mal (omisiones, sustituciones; si se autocorrige, no es error). Al acabar el minuto, toca <b>la última palabra</b> que haya leído. Si termina antes, pulsa <b>Ha terminado</b>.</p>
  <div class="fila"><button class="btn big verde" id="go">▶ Empezar</button><span class="reloj" id="rel">1:00</span><button class="btn big" id="fin" disabled>■ Ha terminado</button></div>
  <div class="aviso am" id="ind" style="display:none">⏰ Tiempo. Toca la última palabra que ha leído.</div>
  <h3 style="font-family:var(--font-read)">${esc(tx.t)}</h3>
  <div class="lectura" id="lec" style="filter:blur(7px)">${htmlPalabras(tx.x)}</div>
  <div class="fila"><button class="btn" id="sig" disabled>Continuar ➜</button></div>`;
  const n=palabras(tx.x).length;
  function finalizar(seg,ultima){fase='hecho';ult=ultima;segFin=seg;
    document.querySelectorAll('#lec .w').forEach(w=>{const i=+w.dataset.i;w.classList.toggle('ult',i===ult);w.classList.toggle('fuera',i>ult);});
    const leidas=ult+1,e=[...errs].filter(i=>i<=ult).length;
    EV.flu={leidas,errores:e,seg:Math.round(seg*10)/10,pcpm:Math.round((leidas-e)*60/seg),precision:Math.round((leidas-e)/leidas*100),total:n};
    $('#sig').disabled=false;$('#ind').style.display='block';$('#ind').className='aviso';
    $('#ind').innerHTML=`✓ ${leidas} palabras leídas, ${e} errores → <b>${EV.flu.pcpm} palabras correctas por minuto</b>. Si te equivocaste, toca otra palabra como «última».`;}
  $('#lec').onclick=e=>{const w=e.target.closest('.w');if(!w)return;const i=+w.dataset.i;
    if(fase==='leyendo'){errs.has(i)?errs.delete(i):errs.add(i);w.classList.toggle('err');}
    else if(fase==='marcar'||fase==='hecho'){finalizar(segFin,i);}};
  $('#go').onclick=()=>{fase='leyendo';$('#lec').style.filter='none';$('#go').disabled=true;$('#fin').disabled=false;
    arrancar(s=>$('#rel').textContent=mmss(60-s),60,()=>{fase='marcar';$('#rel').textContent='0:00';$('#rel').classList.add('fin');$('#fin').disabled=true;$('#ind').style.display='block';});};
  $('#fin').onclick=()=>{const s=parar();$('#fin').disabled=true;finalizar(s,n-1);};
  $('#sig').onclick=pruebaComprension;
}

function pruebaComprension(){pintarPasos(3);const tx=EVAL[EV.curso];const resp=Array(tx.q.length).fill(null);
  $('#paso').innerHTML=`<h3>4. Comprensión</h3>
  <p class="muted">Lee la pregunta en voz alta si hace falta (así se mide lo que entiende, no si sabe leer la pregunta). Las dos primeras son <b>literales</b> y las dos últimas, de <b>inferencia</b>.</p>
  <details><summary style="cursor:pointer;font-weight:600">Ver el texto otra vez</summary><div class="lectura peq">${esc(tx.x)}</div></details>
  <div id="qs">${tx.q.map((q,i)=>`<div style="margin:16px 0"><div style="display:flex;gap:8px;align-items:center"><b style="font-family:var(--font-read);font-size:1.2rem">${i+1}. ${esc(q[0])}</b><button class="btn sec" style="min-height:36px;padding:4px 10px" onclick="hablar(${JSON.stringify(q[0]).replace(/"/g,'&quot;')})" aria-label="Leer pregunta en voz alta">🔊</button></div>
   ${q[1].map((o,j)=>`<button class="opcion" data-q="${i}" data-o="${j}">${esc(o)}</button>`).join('')}</div>`).join('')}</div>
  <button class="btn big" id="ver" disabled>Ver resultado ➜</button>`;
  $('#qs').onclick=e=>{const b=e.target.closest('.opcion');if(!b)return;const i=+b.dataset.q;resp[i]=+b.dataset.o;
    document.querySelectorAll(`.opcion[data-q="${i}"]`).forEach(x=>x.classList.toggle('sel',x===b));$('#ver').disabled=resp.includes(null);};
  $('#ver').onclick=()=>{const ok=resp.map((r,i)=>r===tx.q[i][2]);
    EV.comp={aciertos:ok.filter(Boolean).length,total:ok.length,literal:ok.slice(0,2).filter(Boolean).length,infer:ok.slice(2).filter(Boolean).length,pct:Math.round(ok.filter(Boolean).length/ok.length*100)};
    EV.perfil=calcularPerfil(EV);EV.id=uid();DB.evals.push(EV);guardar();resultado(EV,true);};
}

/* Perfil según la visión simple de la lectura (Gough y Tunmer, 1986) */
function calcularPerfil(e){const A=DB.ajustes,u=A.umbral[e.curso];
  const precPs=Math.round(e.ps.aciertos/e.ps.total*100);
  const deco=precPs>=A.precMin,flu=e.flu.pcpm>=u,comp=e.comp.pct>=A.compMin;
  let tipo,txt,rec;
  if(deco&&flu&&comp){tipo='ok';txt='Sin dificultades aparentes';rec='Mantener la lectura habitual y volver a medir la fluidez en unas semanas.';}
  else if(!deco&&!comp){tipo='mixta';txt='Dificultad mixta (descodificación y comprensión)';rec='Prioridad: correspondencia letra-sonido y lectura de pseudopalabras, junto con vocabulario y comprensión oral (textos leídos en voz alta por el adulto). Valorar con Orientación.';}
  else if(!deco){tipo='deco';txt='Dificultad de descodificación (precisión)';rec='Trabajar conciencia fonológica, correspondencia grafema-fonema y lectura de sílabas y pseudopalabras. Cuando mejore la precisión, pasar a lectura repetida.';}
  else if(!flu&&!comp){tipo='lento';txt='Descodifica, pero lento; afecta a la comprensión';rec='Lectura repetida con escucha previa (el adulto o la app leen primero) 3 veces por semana. En español, la lentitud es el rasgo más frecuente de la dificultad lectora.';}
  else if(!flu){tipo='lento';txt='Descodifica con precisión, pero lento (fluidez)';rec='Lectura repetida con escucha previa, 3 veces por semana, y medir la fluidez cada 2-3 semanas.';}
  else{tipo='comp';txt='Lee bien, pero comprende poco';rec='Vocabulario antes de leer, preguntas de inferencia, resumir con sus palabras y comprensión oral. La descodificación no es el problema.';}
  return {tipo,txt,rec,precPs,deco,flu,comp,umbral:u};}
function chipPerfil(p){const c={ok:'ok',lento:'med',comp:'med',deco:'mal',mixta:'mal'}[p.tipo];const i={ok:'✓',lento:'⏱',comp:'💭',deco:'🔤',mixta:'⚠'}[p.tipo];return `<span class="chip ${c}">${i} ${esc(p.txt)}</span>`;}

function resultado(e,nuevo){const p=e.perfil,a=DB.alumnos.find(x=>x.id===e.al);
  const sem=b=>b?'<span class="chip ok">✓ Adecuado</span>':'<span class="chip mal">✗ Por debajo</span>';
  const precPal=Math.round(e.pal.aciertos/e.pal.total*100);
  const html=`${nuevo?'':`<h2>Perfil lector · ${esc(a?.clave||'')} (${e.curso}.º) · ${fmtF(e.f)}</h2>`}
  ${nuevo?'<div class="pasos">'+['Palabras','Pseudopalabras','Fluidez (1 min)','Comprensión','Resultado'].map((x,i)=>`<span class="paso ${i===4?'on':'hecho'}">${i<4?'✓ ':''}${x}</span>`).join('')+'</div>':''}
  <div class="perfil">
    <div class="kpi"><div class="t">🔤 Descodificación (pseudopalabras)</div><div class="n">${p.precPs}%</div><div class="muted">${e.ps.aciertos}/${e.ps.total} en ${e.ps.seg} s</div>${sem(p.deco)}</div>
    <div class="kpi"><div class="t">⏱ Fluidez (palabras correctas/min)</div><div class="n">${e.flu.pcpm}</div><div class="muted">Referencia ${e.curso}.º: ${p.umbral} · precisión ${e.flu.precision}%</div>${sem(p.flu)}</div>
    <div class="kpi"><div class="t">💭 Comprensión</div><div class="n">${e.comp.aciertos}/${e.comp.total}</div><div class="muted">Literal ${e.comp.literal}/2 · Inferencia ${e.comp.infer}/2</div>${sem(p.comp)}</div>
    <div class="kpi"><div class="t">📖 Palabras reales</div><div class="n">${precPal}%</div><div class="muted">${e.pal.aciertos}/${e.pal.total} en ${e.pal.seg} s</div>${e.pal.seg<e.ps.seg?'<span class="chip inf">Lee mejor palabras conocidas</span>':''}</div>
  </div>
  <div class="conclusion"><div style="margin-bottom:6px">${chipPerfil(p)}</div><b>Qué hacer:</b> ${esc(p.rec)}</div>
  ${e.ps.errores.length?`<p><b>Pseudopalabras con error:</b> ${e.ps.errores.map(esc).join(', ')}</p>`:''}
  ${e.pal.errores.length?`<p><b>Palabras con error:</b> ${e.pal.errores.map(esc).join(', ')}</p>`:''}
  <p class="muted" style="font-size:.85rem">⚠️ Resultado orientativo. Las referencias de fluidez se pueden ajustar en Ajustes con los datos de tu centro. No es un diagnóstico.</p>
  <div class="fila noprint">${p.tipo!=='ok'&&p.tipo!=='deco'?`<button class="btn" onclick="ir('entrenar')">🔁 Empezar lectura repetida</button>`:''}<button class="btn sec" onclick="print()">🖨️ Imprimir</button>${nuevo?'':'<button class="btn sec" onclick="cerrarModal()">Cerrar</button>'}</div>`;
  if(nuevo){$('#paso').innerHTML=html;$('#pasos').remove();toast('✓ Perfil guardado');}else modal(html);
}

/* ================== LECTURA REPETIDA ================== */
let SES=null;
function vEntrenar(){const a=alumno();if(!a)return sinAlumno();
  const textos=[...ENTRENO[a.curso].map((x,i)=>({...x,id:'e'+i})),...(DB.propios||[]).map(x=>({...x,id:x.id,propio:1}))];
  $('#vista').innerHTML=`<div class="card"><h2>Lectura repetida · ${esc(a.clave)} (${a.curso}.º)</h2>
  <p class="muted">La intervención con más evidencia para la fluidez: <b>escuchar el texto primero</b> y <b>leerlo tres veces</b> con corrección. El alumno ve cómo mejora en cada lectura.</p>
  <label for="selT">Texto</label><div class="fila"><select id="selT">${textos.map(t=>`<option value="${t.id}">${esc(t.t)}${t.propio?' (propio)':''} · ${palabras(t.x).length} palabras</option>`).join('')}</select>
  <button class="btn sec" id="nuevoT">➕ Usar mi propio texto</button></div>
  <div id="ses" style="margin-top:14px"></div></div>`;
  $('#nuevoT').onclick=()=>{modal(`<h2>Texto propio</h2><label for="pt">Título</label><input id="pt" style="width:100%"><label for="px" style="margin-top:10px">Texto</label><textarea id="px"></textarea><p class="muted">Consejo: un texto que pueda leer con un 90-95 % de acierto.</p><div class="fila"><button class="btn" id="okT">Guardar</button><button class="btn sec" onclick="cerrarModal()">Cancelar</button></div>`);
    $('#okT').onclick=()=>{const t=$('#pt').value.trim()||'Mi texto',x=$('#px').value.trim();if(palabras(x).length<10)return toast('El texto es muy corto','err');
      DB.propios=DB.propios||[];DB.propios.push({id:uid(),t,x});guardar();cerrarModal();vEntrenar();};};
  const empezar=()=>{const t=textos.find(x=>x.id===$('#selT').value);SES={al:a.id,f:hoy(),texto:t.t,x:t.x,n:palabras(t.x).length,lecturas:[]};pasoEscucha();};
  $('#selT').onchange=empezar;empezar();
}
function cabSes(n){return `<div class="pasos">${['Escucha','Lectura 1','Lectura 2','Lectura 3','Resultado'].map((x,i)=>`<span class="paso ${i===n?'on':i<n?'hecho':''}">${i<n?'✓ ':''}${x}</span>`).join('')}</div>`;}
function pasoEscucha(){
  $('#ses').innerHTML=`${cabSes(0)}<h3>Primero, escucha mientras sigues el texto con el dedo</h3>
  <div class="fila"><button class="btn verde" id="esc">🔊 Escuchar el texto</button><button class="btn sec" id="salta">Lo lee el maestro/a ➜</button></div>
  <div class="lectura" id="lec">${htmlPalabras(SES.x)}</div><button class="btn big" id="sig">Ya lo he escuchado. ¡A leer! ➜</button>`;
  $('#esc').onclick=()=>{const ws=document.querySelectorAll('#lec .w');hablar(SES.x,i=>{ws.forEach(w=>w.classList.remove('leyendo'));ws[i]&&ws[i].classList.add('leyendo');},()=>ws.forEach(w=>w.classList.remove('leyendo')));};
  $('#salta').onclick=$('#sig').onclick=()=>{speechSynthesis.cancel();pasoLectura(1);};
}
function pasoLectura(k){const errs=new Set();let activo=false;
  $('#ses').innerHTML=`${cabSes(k)}<h3>Lectura ${k} de 3</h3>
  <p class="muted">Pulsa <b>Empezar</b> y que lea el texto entero. Toca las palabras que lea mal y pulsa <b>Terminado</b> al acabar.</p>
  <div class="fila"><button class="btn big verde" id="go">▶ Empezar</button><span class="reloj" id="rel">0:00</span><button class="btn big" id="fin" disabled>■ Terminado</button></div>
  ${SES.lecturas.length?`<div class="aviso">Récord a batir: <b>${Math.max(...SES.lecturas.map(l=>l.ppm))}</b> palabras por minuto 💪</div>`:''}
  <div class="lectura" id="lec">${htmlPalabras(SES.x)}</div>`;
  $('#lec').onclick=e=>{const w=e.target.closest('.w');if(!w||!activo)return;const i=+w.dataset.i;errs.has(i)?errs.delete(i):errs.add(i);w.classList.toggle('err');};
  $('#go').onclick=()=>{activo=true;$('#go').disabled=true;$('#fin').disabled=false;arrancar(s=>$('#rel').textContent=mmss(s));};
  $('#fin').onclick=()=>{const s=parar();activo=false;const ppm=Math.round((SES.n-errs.size)*60/s);
    SES.lecturas.push({seg:Math.round(s*10)/10,errores:errs.size,ppm});
    if(k<3){modal(`<h2>Lectura ${k}: ${ppm} palabras por minuto</h2><p>${errs.size} errores · ${Math.round(s)} segundos.</p>${k>1&&ppm>SES.lecturas[k-2].ppm?'<p style="font-size:1.3rem">🎉 ¡Has mejorado!</p>':''}<button class="btn big" id="okL">Siguiente lectura ➜</button>`);$('#okL').onclick=()=>{cerrarModal();pasoLectura(k+1);};}
    else resultadoSes();};
}
function resultadoSes(){SES.id=uid();DB.sesiones.push(SES);guardar();
  const L=SES.lecturas,max=Math.max(...L.map(l=>l.ppm),1),mej=L[2].ppm-L[0].ppm;
  $('#ses').innerHTML=`${cabSes(4)}<h3>${mej>0?'🎉 ¡Has mejorado '+mej+' palabras por minuto!':'¡Buen trabajo! Seguimos practicando.'}</h3>
  <div class="barras">${L.map((l,i)=>`<div class="barra"><div class="v">${l.ppm}</div><div class="b" style="height:0" data-h="${Math.round(l.ppm/max*170)}"></div><div class="l">Lectura ${i+1}<br>${l.errores} errores</div></div>`).join('')}</div>
  <p class="muted">Palabras correctas por minuto en cada lectura.</p><div class="fila"><button class="btn" onclick="vEntrenar()">🔁 Otra sesión</button><button class="btn sec" onclick="ir('seguimiento')">📈 Ver seguimiento</button></div>`;
  requestAnimationFrame(()=>setTimeout(()=>document.querySelectorAll('.barra .b').forEach(b=>b.style.height=b.dataset.h+'px'),50));
  toast('✓ Sesión guardada');}

/* ================== SEGUIMIENTO ================== */
function mediana(a){if(!a.length)return null;const s=[...a].sort((x,y)=>x-y),m=Math.floor(s.length/2);return s.length%2?s[m]:Math.round((s[m-1]+s[m])/2);}
function grafica(puntos,ref,med){if(!puntos.length)return '<p class="muted">Sin datos todavía.</p>';
  const W=700,H=260,P=40,vals=puntos.map(p=>p.v).concat(ref||0,med||0),max=Math.max(...vals)*1.15||10;
  const x=i=>puntos.length===1?W/2:P+i*(W-2*P)/(puntos.length-1),y=v=>H-P-(v/max)*(H-2*P);
  const linea=puntos.map((p,i)=>`${i?'L':'M'}${x(i)},${y(p.v)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:#fff;border-radius:12px" role="img" aria-label="Gráfica de palabras correctas por minuto">
  ${ref?`<line x1="${P}" x2="${W-P}" y1="${y(ref)}" y2="${y(ref)}" stroke="#d97706" stroke-dasharray="6 5" stroke-width="2"/><text x="${W-P}" y="${y(ref)-6}" text-anchor="end" font-size="13" fill="#92400e">Referencia ${ref}</text>`:''}
  ${med?`<line x1="${P}" x2="${W-P}" y1="${y(med)}" y2="${y(med)}" stroke="#7c3aed" stroke-dasharray="2 5" stroke-width="2"/><text x="${P}" y="${y(med)-6}" font-size="13" fill="#6d28d9">Mediana del grupo ${med}</text>`:''}
  <path d="${linea}" fill="none" stroke="#2563eb" stroke-width="3"/>
  ${puntos.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="6" fill="${p.tipo==='e'?'#2563eb':'#16a34a'}"/><text x="${x(i)}" y="${y(p.v)-12}" text-anchor="middle" font-size="13" font-weight="700">${p.v}</text><text x="${x(i)}" y="${H-12}" text-anchor="middle" font-size="11" fill="#64748b">${p.f.slice(8,10)}/${p.f.slice(5,7)}</text>`).join('')}</svg>`;}
function vSeguimiento(){const a=alumno();if(!a)return sinAlumno();
  const evs=DB.evals.filter(e=>e.al===a.id).sort((x,y)=>x.f<y.f?-1:1),ses=DB.sesiones.filter(s=>s.al===a.id).sort((x,y)=>x.f<y.f?-1:1);
  // Mediana del grupo: última evaluación de cada alumno del mismo curso
  const ult=DB.alumnos.filter(x=>x.curso===a.curso).map(x=>DB.evals.filter(e=>e.al===x.id).sort((p,q)=>p.f<q.f?1:-1)[0]).filter(Boolean).map(e=>e.flu.pcpm);
  const med=ult.length>=3?mediana(ult):null;
  const pts=evs.map(e=>({f:e.f,v:e.flu.pcpm,tipo:'e'}));
  const ptsS=ses.map(s=>({f:s.f,v:s.lecturas[0].ppm,tipo:'s'}));
  let alerta='';if(pts.length>=3){const u3=pts.slice(-3);if(u3[2].v<=u3[0].v)alerta=`<div class="aviso am">⚠️ En las tres últimas mediciones la fluidez no mejora. Conviene revisar la intervención y valorarlo con Orientación.</div>`;}
  $('#vista').innerHTML=`<div class="card"><h2>Seguimiento · ${esc(a.clave)} (${a.curso}.º)</h2>
  <p class="muted">Medir la fluidez cada pocas semanas con un minuto de lectura (medida basada en el currículo, CBM) permite ver si la intervención funciona y ajustarla.</p>${alerta}
  <h3>Fluidez en las evaluaciones (palabras correctas por minuto)</h3>${grafica(pts,DB.ajustes.umbral[a.curso],med)}
  ${med?'':'<p class="muted" style="font-size:.85rem">La mediana del grupo aparece cuando haya al menos 3 alumnos/as del mismo curso evaluados.</p>'}
  <h3>Lectura repetida: primera lectura de cada sesión</h3>${grafica(ptsS)}
  <h3>Evaluaciones</h3>${evs.length?`<table><thead><tr><th>Fecha</th><th>Pseudop.</th><th>PCPM</th><th>Comprensión</th><th>Perfil</th><th></th></tr></thead><tbody>${evs.slice().reverse().map(e=>`<tr><td>${fmtF(e.f)}</td><td>${e.perfil.precPs}%</td><td><b>${e.flu.pcpm}</b></td><td>${e.comp.aciertos}/${e.comp.total}</td><td>${chipPerfil(e.perfil)}</td><td><button class="btn sec" onclick="verEval('${e.id}')">Ver</button></td></tr>`).join('')}</tbody></table>`:'<p class="muted">Sin evaluaciones.</p>'}
  <h3>Sesiones de lectura repetida</h3>${ses.length?`<table><thead><tr><th>Fecha</th><th>Texto</th><th>Lect. 1</th><th>Lect. 2</th><th>Lect. 3</th><th>Mejora</th></tr></thead><tbody>${ses.slice().reverse().map(s=>{const L=s.lecturas;const m=L[2].ppm-L[0].ppm;return `<tr><td>${fmtF(s.f)}</td><td>${esc(s.texto)}</td><td>${L[0].ppm}</td><td>${L[1].ppm}</td><td>${L[2].ppm}</td><td><span class="chip ${m>0?'ok':'med'}">${m>0?'+':''}${m}</span></td></tr>`;}).join('')}</tbody></table>`:'<p class="muted">Sin sesiones.</p>'}
  <div class="fila noprint" style="margin-top:14px"><button class="btn sec" onclick="print()">🖨️ Imprimir</button><button class="btn sec" onclick="csv()">⬇️ Exportar CSV (todo el alumnado)</button></div></div>`;}
function verEval(id){resultado(DB.evals.find(e=>e.id===id),false);}
function csv(){const f=[['clave','curso','fecha','tipo','pseudopalabras_%','pcpm','precision_texto_%','comprension','perfil','lectura1','lectura2','lectura3']];
  DB.evals.forEach(e=>{const a=DB.alumnos.find(x=>x.id===e.al);if(a)f.push([a.clave,a.curso,e.f,'evaluacion',e.perfil.precPs,e.flu.pcpm,e.flu.precision,`${e.comp.aciertos}/${e.comp.total}`,e.perfil.txt,'','','']);});
  DB.sesiones.forEach(s=>{const a=DB.alumnos.find(x=>x.id===s.al);if(a)f.push([a.clave,a.curso,s.f,'lectura repetida','','','','',s.texto,...s.lecturas.map(l=>l.ppm)]);});
  descargar('lectorplus.csv','﻿'+f.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n'),'text/csv');}
function descargar(n,c,t){const b=new Blob([c],{type:t}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}

/* ================== FUNDAMENTOS ================== */
function vBase(){$('#vista').innerHTML=`<div class="card"><h2>En qué se basa Lector+</h2>
<h3>1. La visión simple de la lectura</h3><p>Comprender un texto es el producto de dos capacidades: <b>descodificar</b> (reconocer las palabras escritas) y <b>comprender el lenguaje</b>. Si falla una de ellas, falla la comprensión lectora. Por eso la app separa los perfiles: descodifica mal, descodifica pero lento, comprende poco o dificultad mixta.<br><span class="muted">Gough y Tunmer (1986); Hoover y Gough (1990); Catts, Adlof y Ellis Weismer (2006).</span></p>
<h3>2. En español, la velocidad delata la dificultad</h3><p>En una ortografía transparente como la nuestra, la dificultad lectora se nota más en la <b>fluidez</b> que en la precisión. Las <b>pseudopalabras</b> obligan a usar la ruta fonológica y no se pueden adivinar por el contexto.<br><span class="muted">Modelo de doble ruta; PROLEC-R (Cuetos, Rodríguez, Ruano y Arribas); test LEE (Defior et al., 2006); Serrano Chica (UGR).</span></p>
<h3>3. Medir: palabras correctas por minuto</h3><p>Un minuto de lectura en voz alta, contando los errores, es un indicador fiable del nivel lector general y sirve para el cribado y para ver el progreso. Usar estas medidas para ajustar la enseñanza mejora los resultados del alumnado.<br><span class="muted">Medida basada en el currículo (CBM): Deno (1985); Fuchs et al. (2001).</span></p>
<h3>4. Intervenir: lectura repetida con escucha previa</h3><p>Leer el mismo texto varias veces con corrección es la intervención con más evidencia para mejorar la fluidez de alumnado con dificultades, y también mejora la comprensión. Escuchar antes el texto leído por un buen lector aumenta el efecto.<br><span class="muted">Metaanálisis: Therrien (2004), efectos de 0,75 en fluidez y 0,73 en comprensión; Lee y Yoon (2017), g = 1,41; Stevens, Walker y Vaughn (2017).</span></p>
<h3>5. El adulto, imprescindible</h3><p>La lectura guiada en voz alta, con un adulto que modela y da retroalimentación, desarrolla la fluidez. La app no sustituye al maestro o la maestra: le ayuda a medir y a organizar la práctica.<br><span class="muted">Education Endowment Foundation (2021), Improving Literacy in Key Stage 2.</span></p>
<div class="aviso am">Las referencias de palabras por minuto de cada curso son orientativas. Lo ideal es ajustarlas con la mediana de tu propio alumnado (la app la calcula en Seguimiento).</div></div>`;}

/* ================== AJUSTES ================== */
function vAjustes(){const A=DB.ajustes;
  $('#vista').innerHTML=`<div class="card"><h2>Ajustes</h2>
  <h3>Referencia de fluidez por curso (palabras correctas por minuto)</h3><p class="muted">Orientativas. Ajústalas con los datos de tu centro.</p>
  <div class="fila">${[1,2,3,4,5,6].map(c=>`<div><label for="u${c}">${c}.º</label><input id="u${c}" type="number" min="5" max="250" value="${A.umbral[c]}" style="width:90px"></div>`).join('')}</div>
  <div class="fila" style="margin-top:12px"><div><label for="pm">Precisión mínima en pseudopalabras (%)</label><input id="pm" type="number" value="${A.precMin}" style="width:110px"></div>
  <div><label for="cm">Comprensión mínima (%)</label><input id="cm" type="number" value="${A.compMin}" style="width:110px"></div></div>
  <button class="btn" id="gA" style="margin-top:12px">Guardar ajustes</button>
  <h3>Copia de seguridad</h3><p class="muted">Los datos están solo en este navegador. Descarga una copia de vez en cuando.</p>
  <div class="fila"><button class="btn sec" id="exp">⬇️ Descargar copia</button><label class="btn sec" style="margin:0;display:inline-flex;align-items:center">⬆️ Restaurar copia<input type="file" id="imp" accept=".json" hidden></label><button class="btn rojo" id="del">Borrar todo</button></div></div>`;
  $('#gA').onclick=()=>{[1,2,3,4,5,6].forEach(c=>A.umbral[c]=+$('#u'+c).value||A.umbral[c]);A.precMin=+$('#pm').value||80;A.compMin=+$('#cm').value||75;guardar();toast('✓ Ajustes guardados');};
  $('#exp').onclick=()=>descargar(`lectorplus-copia-${hoy()}.json`,JSON.stringify(DB),'application/json');
  $('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{DB=JSON.parse(r.result);guardar();toast('✓ Copia restaurada');ir('alumnado');}catch(x){toast('Archivo no válido','err');}};r.readAsText(f);};
  $('#del').onclick=()=>{modal(`<h2>¿Borrar todos los datos?</h2><p class="muted">No se puede deshacer. Descarga antes una copia.</p><div class="fila"><button class="btn rojo" id="okD">Borrar todo</button><button class="btn sec" onclick="cerrarModal()">Cancelar</button></div>`);
    $('#okD').onclick=()=>{DB.alumnos=[];DB.evals=[];DB.sesiones=[];DB.actual=null;guardar();cerrarModal();ir('alumnado');};};}

ir('alumnado');
</script>
