<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f5fbf">
<meta name="description" content="Procesador de textos del CEIP Capitulaciones de Santa Fe">
<link rel="manifest" href="./manifest.webmanifest">
<title>Capitexto · Procesador de textos del CEIP Capitulaciones</title>
<link rel="icon" href="logo-cole.png">
<style>
:root{--azul:#1f5fbf;--azul2:#174a96;--tinta:#1b1f2a;--gris:#5b6578;--linea:#d9dfea;--fondo:#e9edf3;--cinta:#f7f9fc}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:var(--tinta);background:var(--fondo);display:flex;flex-direction:column;overflow:hidden}
button,select,input{font-family:inherit}
/* barra de título */
.tb{background:var(--azul);color:#fff;display:flex;align-items:center;gap:10px;padding:6px 12px;flex:none}
.tb img{width:30px;height:30px;border-radius:7px;background:#fff;object-fit:contain;padding:2px}
.tb .marca{font-weight:700;font-size:15px;white-space:nowrap}
.tb input{flex:1;min-width:60px;max-width:420px;background:rgba(255,255,255,.14);border:1px solid transparent;color:#fff;border-radius:6px;padding:5px 9px;font-size:14px;font-weight:600}
.tb input::placeholder{color:rgba(255,255,255,.7)}
.tb input:focus{outline:none;background:#fff;color:var(--tinta)}
.tb .est{margin-left:auto;font-size:12px;opacity:.9;white-space:nowrap}
/* menú de archivo */
.menu{background:var(--azul2);display:flex;gap:2px;padding:0 8px;flex:none;overflow-x:auto}
.menu button{background:none;border:0;color:#fff;font-size:13px;font-weight:600;padding:7px 11px;cursor:pointer;white-space:nowrap;border-radius:5px 5px 0 0}
.menu button:hover{background:rgba(255,255,255,.16)}
/* cinta */
.cinta{background:var(--cinta);border-bottom:1px solid var(--linea);display:flex;align-items:stretch;gap:0;padding:5px 6px;flex:none;overflow-x:auto}
.grp{display:flex;flex-direction:column;justify-content:space-between;padding:0 8px;border-right:1px solid var(--linea);flex:none}
.grp:last-child{border-right:0}
.grp .fila{display:flex;align-items:center;gap:3px;min-height:30px}
.grp .tit{font-size:10px;color:var(--gris);text-align:center;margin-top:2px;letter-spacing:.02em}
.b{min-width:30px;height:28px;border:1px solid transparent;background:none;border-radius:5px;cursor:pointer;font-size:14px;color:var(--tinta);display:inline-flex;align-items:center;justify-content:center;padding:0 6px;gap:4px;white-space:nowrap}
.b:hover{background:#e4ebf7;border-color:#c9d6ee}
.b.on{background:#cfe0fb;border-color:#9dbdf0}
.b svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.cinta select{height:28px;border:1px solid var(--linea);border-radius:5px;background:#fff;font-size:13px;padding:0 4px;color:var(--tinta)}
.col{position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:30px;height:28px;border-radius:5px;cursor:pointer;font-weight:700;font-size:14px}
.col:hover{background:#e4ebf7}
.col i{display:block;width:18px;height:4px;border-radius:2px;margin-top:1px}
.col input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
/* pestañas estilo cinta de Word */
.pestanas{display:flex;align-items:stretch;gap:2px;padding:0 10px;background:#fff;border-bottom:1px solid var(--linea);flex:none}
.pestanas button{border:0;background:transparent;color:#344054;padding:8px 15px 7px;font-size:13px;cursor:pointer;border-bottom:3px solid transparent}
.pestanas button:hover{background:#edf2fa}
.pestanas button.activa{color:var(--azul2);font-weight:700;border-bottom-color:var(--azul)}
.cinta .grp[data-panel]{display:none}
.cinta .grp[data-panel].visible{display:flex}
@media(max-width:820px){.pestanas{overflow-x:auto}.pestanas button{padding:8px 11px}}
/* zona de trabajo */
.ws{flex:1;overflow:auto;padding:22px 12px 60px;position:relative}
.hoja{--mt:25mm;--mr:25mm;--mb:25mm;--ml:25mm;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;background:#fff;box-shadow:0 2px 14px rgba(40,60,100,.18);padding:var(--mt) var(--mr) var(--mb) var(--ml);outline:none;font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-size:11pt;line-height:1.35;color:#1b1b1b;overflow-wrap:break-word;
  background-image:repeating-linear-gradient(to bottom,#fff 0,#fff 297mm,#dfe5ee 297mm,#dfe5ee 309mm);background-size:100% 309mm}
.hoja p{margin:0 0 8pt}
.hoja .cap-hf{font-size:9pt;color:#555;min-height:14pt;outline:1px dashed #d7deea;padding:2pt 4pt;margin:0 0 8pt;white-space:normal}
.hoja .cap-footer{margin:12pt 0 0;border-top:1px solid #d7deea;padding-top:4pt}
.hoja .cap-hf:empty:before{content:attr(data-placeholder);color:#9aa3b2}
.hoja .cap-hf:focus{outline:1px solid #8aafe8}
.hoja h1{font-size:20pt;margin:14pt 0 6pt;color:#1f3864;line-height:1.2}
.hoja h2{font-size:15pt;margin:12pt 0 5pt;color:#2e5597;line-height:1.25}
.hoja h3{font-size:12.5pt;margin:10pt 0 4pt;color:#2e5597}
.hoja ul,.hoja ol{margin:0 0 8pt;padding-left:26pt}
.hoja li{margin-bottom:2pt}
.hoja table{border-collapse:collapse;width:100%;margin:0 0 8pt;table-layout:fixed}
.hoja td,.hoja th{border:1px solid #8a94a6;padding:4pt 6pt;vertical-align:top;min-width:20px}
.hoja td p,.hoja th p{margin:0}
.hoja table.membrete td{border:0;vertical-align:middle;padding:2pt 6pt}
.hoja table.membrete{border-bottom:2px solid #1f5fbf;margin-bottom:12pt}
.hoja img{max-width:100%;height:auto}
.hoja img.sel{outline:2px solid var(--azul);outline-offset:2px}
.hoja hr{border:0;border-top:1px solid #8a94a6;margin:10pt 0}
.hoja a{color:#1155cc}
.hoja blockquote{margin:0 0 0 30pt;padding:0;border:0}
.salto{border-top:2px dashed #9aa7bd;margin:14pt 0;text-align:center;font:600 10px "Segoe UI",sans-serif;color:#7b879b;line-height:0;user-select:none}
.salto span{background:#fff;padding:0 8px}
/* barra de imagen */
.ibar{position:absolute;display:none;background:#fff;border:1px solid var(--linea);border-radius:8px;box-shadow:0 6px 18px rgba(40,60,100,.2);padding:4px;gap:2px;z-index:20}
.ibar .b{font-size:12px;height:26px}
/* barra de estado */
.sb{background:var(--cinta);border-top:1px solid var(--linea);display:flex;align-items:center;gap:14px;padding:4px 12px;font-size:12px;color:var(--gris);flex:none}
.sb .z{margin-left:auto;display:flex;align-items:center;gap:6px}
.sb input[type=range]{width:110px}
/* diálogos */
.vel{position:fixed;inset:0;background:rgba(20,30,50,.42);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.dlg{background:#fff;border-radius:14px;max-width:520px;width:100%;max-height:86vh;overflow:auto;padding:18px 20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dlg h3{margin:0 0 12px;font-size:17px}
.dlg label{display:block;font-size:12px;font-weight:600;color:var(--gris);margin:8px 0 3px}
.dlg input[type=text],.dlg input[type=url]{width:100%;border:1px solid var(--linea);border-radius:8px;padding:8px 10px;font-size:14px}
.dlg .pie{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.bt{border:1px solid var(--linea);background:#fff;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--tinta)}
.bt.p{background:var(--azul);border-color:var(--azul);color:#fff}
.bt.r{color:#b3261e;border-color:#f0c9c6}
.doc{display:flex;align-items:center;gap:8px;border:1px solid var(--linea);border-radius:10px;padding:9px 11px;margin-bottom:7px}
.doc .n{flex:1;min-width:0}
.doc .n b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc .n small{color:var(--gris);font-size:11.5px}
.rej{display:grid;grid-template-columns:repeat(8,22px);gap:3px;margin-top:6px}
.rej i{width:22px;height:22px;border:1px solid var(--linea);border-radius:3px;display:block;cursor:pointer}
.rej i.h{background:#cfe0fb;border-color:#7fa8ea}
.aviso{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:#1b1f2a;color:#fff;font-size:13px;padding:9px 16px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
.aviso.v{opacity:.95}
@media(max-width:820px){.hoja{padding:14mm 9mm;min-height:60vh;background-image:none}.tb .marca{display:none}.ws{padding:10px 6px 50px}}
@media print{
  body{display:block;overflow:visible;background:#fff}
  .tb,.menu,.pestanas,.cinta,.sb,.ibar,.vel,.aviso{display:none!important}
  .ws{overflow:visible;padding:0}
  .hoja{width:auto;min-height:0;box-shadow:none;padding:0;background-image:none;zoom:1!important}
  .hoja .cap-hf{outline:0;color:#444}
  .hoja .cap-hf:empty:before{content:""}
  .hoja .cap-footer{position:relative}
  .hoja img.sel{outline:0}
  .salto{border:0;margin:0;height:0;page-break-after:always;break-after:page}.salto span{display:none}
  .hoja *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4;margin:25mm}
}
</style>
</head>
<body>
<header class="tb">
  <img src="logo-cole.png" alt="">
  <span class="marca">Capitexto</span>
  <input id="titulo" placeholder="Documento sin título" aria-label="Nombre del documento" maxlength="120">
  <span class="est" id="est">Guardado</span>
</header>
<div class="menu">
  <button id="m-nuevo">📄 Nuevo</button>
  <button id="m-abrir">📂 Abrir (Word, texto…)</button>
  <button id="m-docs">🗂️ Mis documentos</button>
  <button id="m-docx">⬇️ Guardar como Word</button>
  <button id="m-pdf">🖨️ Imprimir / PDF</button>
  <input type="file" id="f-abrir" accept=".docx,.txt,.html,.htm" hidden>
  <input type="file" id="f-img" accept="image/*" hidden>
</div>
<nav class="pestanas" id="pestanas" aria-label="Pestañas de herramientas">
  <button class="activa" data-panel-tab="inicio">Inicio</button>
  <button data-panel-tab="insertar">Insertar</button>
  <button data-panel-tab="disposicion">Disposición</button>
  <button data-panel-tab="revisar">Revisar</button>
  <button data-panel-tab="vista">Vista</button>
</nav>
<div class="cinta" id="cinta">
  <div class="grp" data-panel="inicio"><div class="fila">
    <button class="b" data-c="undo" title="Deshacer (Ctrl+Z)">↶</button>
    <button class="b" data-c="redo" title="Rehacer (Ctrl+Y)">↷</button>
  </div><div class="tit">Deshacer</div></div>

  <div class="grp" data-panel="inicio"><div class="fila">
    <select id="s-fuente" title="Tipo de letra">
      <option>Arial</option><option>Arial Narrow</option><option>Aptos</option><option>Aptos Display</option><option>Calibri</option><option>Cambria</option><option>Candara</option><option>Century Gothic</option><option>Comic Sans MS</option><option>Consolas</option><option>Constantia</option><option>Courier New</option><option>Franklin Gothic Medium</option><option>Garamond</option><option>Georgia</option><option>Helvetica</option><option>Lucida Sans</option><option>Palatino Linotype</option><option>Segoe UI</option><option>Tahoma</option><option>Times New Roman</option><option>Trebuchet MS</option><option>Verdana</option>
    </select>
    <select id="s-tam" title="Tamaño de letra">
      <option>8</option><option>9</option><option>10</option><option selected>11</option><option>12</option><option>14</option><option>16</option><option>18</option><option>20</option><option>24</option><option>28</option><option>36</option><option>48</option><option>72</option>
    </select>
  </div><div class="fila">
    <button class="b" data-c="bold" title="Negrita (Ctrl+B)"><b>N</b></button>
    <button class="b" data-c="italic" title="Cursiva (Ctrl+I)"><i>K</i></button>
    <button class="b" data-c="underline" title="Subrayado (Ctrl+U)"><u>S</u></button>
    <button class="b" data-c="strikeThrough" title="Tachado"><s>abc</s></button>
    <span class="col" title="Color de la letra">A<i id="i-color" style="background:#d00000"></i><input type="color" id="c-color" value="#d00000"></span>
    <span class="col" title="Resaltar">🖍<i id="i-res" style="background:#ffe45c"></i><input type="color" id="c-res" value="#ffe45c"></span>
    <button class="b" data-c="removeFormat" title="Quitar el formato">⌫</button>
  </div><div class="tit">Fuente</div></div>

  <div class="grp" data-panel="inicio"><div class="fila">
    <button class="b" data-c="justifyLeft" title="Alinear a la izquierda"><svg viewBox="0 0 16 16"><path d="M2 3h12M2 6.5h8M2 10h12M2 13.5h8"/></svg></button>
    <button class="b" data-c="justifyCenter" title="Centrar"><svg viewBox="0 0 16 16"><path d="M2 3h12M4 6.5h8M2 10h12M4 13.5h8"/></svg></button>
    <button class="b" data-c="justifyRight" title="Alinear a la derecha"><svg viewBox="0 0 16 16"><path d="M2 3h12M6 6.5h8M2 10h12M6 13.5h8"/></svg></button>
    <button class="b" data-c="justifyFull" title="Justificar"><svg viewBox="0 0 16 16"><path d="M2 3h12M2 6.5h12M2 10h12M2 13.5h12"/></svg></button>
  </div><div class="fila">
    <button class="b" data-c="insertUnorderedList" title="Lista con viñetas">• ≡</button>
    <button class="b" data-c="insertOrderedList" title="Lista numerada">1. ≡</button>
    <button class="b" data-c="outdent" title="Disminuir sangría">⇤</button>
    <button class="b" data-c="indent" title="Aumentar sangría">⇥</button>
  </div><div class="tit">Párrafo</div></div>

  <div class="grp" data-panel="inicio"><div class="fila">
    <select id="s-estilo" title="Estilo">
      <option value="P">Normal</option><option value="H1">Título 1</option><option value="H2">Título 2</option><option value="H3">Título 3</option>
    </select>
  </div><div class="fila">&nbsp;</div><div class="tit">Estilos</div></div>

  <div class="grp" data-panel="insertar"><div class="fila">
    <button class="b" id="b-tabla" title="Insertar tabla">▦ Tabla</button>
    <button class="b" id="b-img" title="Insertar imagen">🖼 Imagen</button>
    <button class="b" id="b-link" title="Insertar enlace">🔗 Enlace</button>
  </div><div class="fila">
    <button class="b" id="b-hr" title="Línea horizontal">― Línea</button>
    <button class="b" id="b-salto" title="Salto de página">⤓ Salto de página</button>
    <button class="b" id="b-memb" title="Poner arriba el membrete del colegio">🏫 Membrete</button>
  </div><div class="tit">Insertar</div></div>

  <div class="grp" id="g-tabla" style="display:none"><div class="fila">
    <button class="b" data-t="fila+" title="Añadir fila debajo">＋ Fila</button>
    <button class="b" data-t="col+" title="Añadir columna a la derecha">＋ Columna</button>
  </div><div class="fila">
    <button class="b" data-t="fila-" title="Quitar esta fila">－ Fila</button>
    <button class="b" data-t="col-" title="Quitar esta columna">－ Columna</button>
    <button class="b" data-t="del" title="Eliminar la tabla">🗑</button>
  </div><div class="tit">Tabla</div></div>

  <div class="grp" data-panel="disposicion"><div class="fila">
    <button class="b" id="b-pagina" title="Configurar página, márgenes y encabezado/pie">📐 Configurar página</button>
  </div><div class="fila">&nbsp;</div><div class="tit">Diseño de página</div></div>
  <div class="grp" data-panel="revisar"><div class="fila">
    <button class="b" id="b-buscar" title="Buscar y reemplazar (Ctrl+H)">🔎 Buscar y reemplazar</button>
  </div><div class="fila">&nbsp;</div><div class="tit">Revisión</div></div>
  <div class="grp" data-panel="vista"><div class="fila">
    <button class="b" data-zoom="80">80 %</button><button class="b" data-zoom="100">100 %</button><button class="b" data-zoom="120">120 %</button>
  </div><div class="fila">&nbsp;</div><div class="tit">Zoom del documento</div></div>
</div>

<main class="ws" id="ws">
  <div class="hoja" id="hoja" contenteditable="true" spellcheck="true" lang="es"><div class="cap-hf cap-header" contenteditable="true" data-cap-hf="header" data-placeholder="Haz clic para escribir el encabezado…"></div><p><br></p><div class="cap-hf cap-footer" contenteditable="true" data-cap-hf="footer" data-placeholder="Haz clic para escribir el pie de página…"></div></div>
  <div class="ibar" id="ibar">
    <button class="b" data-i="25">25 %</button><button class="b" data-i="50">50 %</button><button class="b" data-i="75">75 %</button><button class="b" data-i="100">100 %</button>
    <button class="b" data-i="izq" title="A la izquierda">⇤</button><button class="b" data-i="cen" title="Centrada">↔</button><button class="b" data-i="der" title="A la derecha">⇥</button>
    <button class="b" data-i="del" title="Eliminar imagen">🗑</button>
  </div>
</main>

<footer class="sb">
  <span id="cuenta">0 palabras</span>
  <span class="z"><span id="zt">100 %</span><input type="range" id="zoom" min="50" max="200" step="10" value="100" aria-label="Zoom"></span>
</footer>

<div class="vel" id="vel"><div class="dlg" id="dlg"></div></div>
<div class="aviso" id="aviso"></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const hoja=$('hoja'), titulo=$('titulo');
const VACIO='<p><br></p>';
const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function aviso(t){const a=$('aviso');a.textContent=t;a.classList.add('v');clearTimeout(aviso._t);aviso._t=setTimeout(()=>a.classList.remove('v'),2600);}

// ═════ almacenamiento (IndexedDB, en este dispositivo) ═════
const BD={
  _p:null,
  abrir(){ if(!this._p) this._p=new Promise((ok,ko)=>{const r=indexedDB.open('capitexto',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('docs',{keyPath:'id'});
    r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error);}); return this._p; },
  async tx(modo,fn){const db=await this.abrir();return new Promise((ok,ko)=>{const t=db.transaction('docs',modo);const rq=fn(t.objectStore('docs'));
    t.oncomplete=()=>ok(rq&&rq.result);t.onerror=()=>ko(t.error);});},
  guardar(d){return this.tx('readwrite',s=>s.put(d));},
  leer(id){return this.tx('readonly',s=>s.get(id));},
  todos(){return this.tx('readonly',s=>s.getAll());},
  borrar(id){return this.tx('readwrite',s=>s.delete(id));}
};
const MARGEN_DEF={top:2.5,right:2.5,bottom:2.5,left:2.5};
let estadoMargenes={...MARGEN_DEF};
let DOC={id:null,titulo:'',html:VACIO,hf:{header:'',footer:''},margenes:{...MARGEN_DEF},mod:0};
const nuevoId=()=>'d'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let tGuardar=null;
function sucio(){ $('est').textContent='Guardando…'; clearTimeout(tGuardar); tGuardar=setTimeout(guardar,700); contar(); }
async function guardar(){
  DOC.titulo=titulo.value.trim(); DOC.html=limpiaHTML(); DOC.hf=datosHF(); DOC.margenes=estadoMargenes; DOC.mod=Date.now();
  try{ await BD.guardar(DOC); localStorage.setItem('capitexto_actual',DOC.id); $('est').textContent='Guardado en este dispositivo'; }
  catch(e){ $('est').textContent='⚠️ No se ha podido guardar'; }
}
function limpiaHTML(){ const c=hoja.cloneNode(true); quitarPag(c); c.querySelectorAll('.cap-hf,img.sel').forEach(i=>i.remove()); return c.innerHTML.replace(/\u200B/g,''); }
function datosHF(){return {header:hoja.querySelector('[data-cap-hf=header]')?.innerHTML||'',footer:hoja.querySelector('[data-cap-hf=footer]')?.innerHTML||''};}
function ponerHF(d={}){const h=hoja.querySelector('[data-cap-hf=header]'),f=hoja.querySelector('[data-cap-hf=footer]');if(h)h.innerHTML=d.header||'';if(f)f.innerHTML=d.footer||'';}
function insertarZonasHF(){if(!hoja.querySelector('[data-cap-hf=header]'))hoja.insertAdjacentHTML('afterbegin','<div class="cap-hf cap-header" contenteditable="true" data-cap-hf="header" data-placeholder="Haz clic para escribir el encabezado…"></div>');if(!hoja.querySelector('[data-cap-hf=footer]'))hoja.insertAdjacentHTML('beforeend','<div class="cap-hf cap-footer" contenteditable="true" data-cap-hf="footer" data-placeholder="Haz clic para escribir el pie de página…"></div>');}
function cargar(d){ setTimeout(paginar,60); DOC=d; titulo.value=d.titulo||''; hoja.innerHTML=d.html||VACIO; insertarZonasHF(); ponerHF(d.hf||{}); aplicarMargenes(d.margenes||{}); ocultarIbar(); contar(); estado(); document.title=(d.titulo||'Documento sin título')+' · Capitexto'; }
function docNuevo(){ cargar({id:nuevoId(),titulo:'',html:VACIO,hf:{header:'',footer:''},margenes:{...MARGEN_DEF},mod:Date.now()}); guardar(); hoja.focus(); }

// ═════ selección y órdenes de formato ═════
let rango=null;
document.addEventListener('selectionchange',()=>{
  const s=getSelection(); if(!s.rangeCount) return;
  const r=s.getRangeAt(0);

function sanear(html){
  const d=new DOMParser().parseFromString(String(html||''),'text/html');
  d.querySelectorAll('script,style,link,meta,iframe,object,embed,form,base').forEach(n=>n.remove());
  // Word y algunas aplicaciones introducen nodos auxiliares de Office sin contenido útil.
  d.querySelectorAll('o\\:p, w\\:proofErr').forEach(n=>n.replaceWith(...n.childNodes));
  const permitidos=new Set(['color','background-color','font-family','font-size','font-weight','font-style','text-decoration','text-align','vertical-align','white-space','margin','margin-left','margin-right','margin-top','margin-bottom','text-indent','width','height','max-width','border','border-top','border-right','border-bottom','border-left','border-collapse','padding','padding-left','padding-right','padding-top','padding-bottom','list-style-type']);
  d.querySelectorAll('*').forEach(n=>{
    [...n.attributes].forEach(a=>{
      const k=a.name.toLowerCase(), v=a.value.trim();
      if(k.startsWith('on') || k==='srcdoc' || k==='formaction') { n.removeAttribute(a.name); return; }
      if((k==='href'||k==='src') && !/^(https?:|mailto:|tel:|data:image\/(png|jpeg|gif|webp);base64,|#)/i.test(v)) n.removeAttribute(a.name);
      if(k==='style'){
        const reglas=[];
        v.split(';').forEach(regla=>{
          const i=regla.indexOf(':'); if(i<1) return;
          const prop=regla.slice(0,i).trim().toLowerCase(), val=regla.slice(i+1).trim();
          if(permitidos.has(prop) && !/(expression|javascript:|url\s*\(|@import|behavior|\-moz-binding)/i.test(val)) reglas.push(prop+':'+val);
        });
        if(reglas.length) n.setAttribute('style',reglas.join(';')); else n.removeAttribute('style');
      }
    });
  });
  return d.body.innerHTML;
}

      html=(await f.text()).split(/\r?\n/).map(l=>'<p>'+(esc(l)||'<br>')+'</p>').join('');
    } else if(ext==='html'||ext==='htm'){
      html=sanear(await f.text());
    } else if(ext==='doc'){ aviso('Los .doc antiguos no se pueden abrir: guárdalo antes como .docx'); return; }
    else { aviso('Formato no compatible. Abre DOCX, TXT o HTML.'); return; }
    await guardar();
    cargar({id:nuevoId(),titulo:nombre,html:html||VACIO,hf:{header:'',footer:''},margenes:{...MARGEN_DEF},mod:Date.now()});
    await guardar();
    aviso('Abierto: '+f.name+' · revisa la paginación y los elementos complejos');
  }catch(er){ aviso('No se ha podido abrir el archivo'); console.error(er); }
}

const hex=c=>{ const m=String(c).match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?/); if(!m) return null; if(m[4]!==undefined&&+m[4]===0) return null;
  return [m[1],m[2],m[3]].map(x=>(+x).toString(16).padStart(2,'0')).join('').toUpperCase(); };
const ANCHO_TW=9071, ANCHO_PX=604;   // 16 cm útiles
async function imgRun(D,img,maxPx){
  const c=document.createElement('canvas'); c.width=img.naturalWidth||1; c.height=img.naturalHeight||1;
  c.getContext('2d').drawImage(img,0,0);
  const b=await new Promise(r=>c.toBlob(r,'image/png')); const data=new Uint8Array(await b.arrayBuffer());
  const tope=maxPx||ANCHO_PX; let w;
  const pct=/%$/.test(img.style.width)?parseFloat(img.style.width):null, px=/px$/.test(img.style.width)?parseFloat(img.style.width):null;
  w=pct?tope*pct/100:px?px:Math.min(img.naturalWidth,tope); w=Math.min(w,tope);
  const h=w*(img.naturalHeight/(img.naturalWidth||1));
  return new D.ImageRun({type:'png',data,transformation:{width:Math.round(w),height:Math.round(h)}});
}
function estiloRun(D,nodo,base){
  const el=nodo.parentElement, cs=getComputedStyle(el), o={};
  if(parseInt(cs.fontWeight)>=600) o.bold=true;
  if(cs.fontStyle==='italic') o.italics=true;
  o.size=Math.round(parseFloat(cs.fontSize)*0.75*2);
  const col=hex(cs.color); if(col&&col!=='1B1B1B') o.color=col;
  const f=(cs.fontFamily.split(',')[0]||'').replace(/["']/g,'').trim(); if(f) o.font=f;
  let a=el, sub=false, tach=false, fondo=null;
  while(a&&a!==hoja){
    const s=getComputedStyle(a), dl=s.textDecorationLine||'';
    if(a.tagName==='U'||dl.includes('underline')) sub=true;
    if(a.tagName==='S'||a.tagName==='STRIKE'||dl.includes('line-through')) tach=true;
    if(a.tagName==='SUP') o.superScript=true; if(a.tagName==='SUB') o.subScript=true;
    if(!fondo&&!/^(TD|TH|TR|TABLE|TBODY)$/.test(a.tagName)){ const bg=hex(s.backgroundColor); if(bg&&bg!=='FFFFFF') fondo=bg; }
    a=a.parentElement;
  }
  if(sub||base.enlace) o.underline={};
  if(tach) o.strike=true;
  if(base.enlace&&!o.color) o.color='1155CC';
  if(fondo) o.shading={type:D.ShadingType.CLEAR,color:'auto',fill:fondo};
  return o;
}
async function runs(D,nodos,base,maxPx){
  const out=[];
  for(const n of nodos){
    if(n.nodeType===3){
      const pre=/pre/.test(getComputedStyle(n.parentElement).whiteSpace);
      const t=(pre?n.data:n.data.replace(/\s+/g,' ')).replace(/\u200B/g,''); if(!t) continue;
      out.push(new D.TextRun(Object.assign({text:t},estiloRun(D,n,base))));
    } else if(n.nodeType===1){
      if(n.tagName==='BR'){ if(n.nextSibling||out.length) out.push(new D.TextRun({break:1})); }
      else if(n.tagName==='IMG'){ try{ out.push(await imgRun(D,n,maxPx)); }catch(e){} }
      else if(n.tagName==='A'&&n.getAttribute('href')){
        const hijos=await runs(D,[...n.childNodes],Object.assign({},base,{enlace:true}),maxPx);
        if(hijos.length) out.push(new D.ExternalHyperlink({link:n.getAttribute('href'),children:hijos}));
      }
      else if(/^(UL|OL|TABLE)$/.test(n.tagName)){ /* se tratan como bloque */ }
      else out.push(...await runs(D,[...n.childNodes],base,maxPx));
    }
  }
  return out;
}
const ES_BLOQUE=/^(P|DIV|H1|H2|H3|H4|H5|H6|UL|OL|LI|TABLE|HR|BLOCKQUOTE|PRE|SECTION|ARTICLE)$/;
function propsParrafo(D,el,extra){
  const o=Object.assign({spacing:{after:160}},extra||{});
  if(el&&el.nodeType===1){
    const ta=getComputedStyle(el).textAlign;
    if(ta==='center') o.alignment=D.AlignmentType.CENTER; else if(ta==='right'||ta==='end') o.alignment=D.AlignmentType.RIGHT; else if(ta==='justify') o.alignment=D.AlignmentType.JUSTIFIED;
    const hl={H1:D.HeadingLevel.HEADING_1,H2:D.HeadingLevel.HEADING_2,H3:D.HeadingLevel.HEADING_3}[el.tagName]; if(hl) o.heading=hl;
    let s=0,a=el; while(a&&a!==hoja){ if(a.tagName==='BLOCKQUOTE') s++; a=a.parentElement; }
    const ml=parseFloat(getComputedStyle(el).marginLeft)||0; if(el.tagName!=='BLOCKQUOTE'&&ml>=30&&!extra) s+=Math.round(ml/40);
    if(s&&!o.numbering) o.indent={left:720*s};
  }
  return o;
}
async function bloques(D,cont,ctx,maxPx){
  const out=[]; let pend=[];
  const volcar=async()=>{ if(!pend.length) return; const r=await runs(D,pend,{},maxPx); pend=[]; if(r.length) out.push(new D.Paragraph(Object.assign(propsParrafo(D,cont===hoja?null:cont),{children:r}))); };
  for(const n of [...cont.childNodes]){
    if(n.nodeType===3){ if(n.data.trim()||pend.length) pend.push(n); continue; }
    if(n.nodeType!==1) continue;
    if(!ES_BLOQUE.test(n.tagName)){ pend.push(n); continue; }
    await volcar();
    const tg=n.tagName;
    if(n.classList.contains('salto')){ out.push(new D.Paragraph({children:[new D.PageBreak()]})); }
    else if(tg==='HR'){ out.push(new D.Paragraph({spacing:{after:160},border:{bottom:{style:D.BorderStyle.SINGLE,size:6,color:'8A94A6',space:1}},children:[]})); }
    else if(tg==='UL'||tg==='OL'){ out.push(...await lista(D,n,ctx,0,maxPx)); }
    else if(tg==='TABLE'){ out.push(await tabla(D,n,ctx)); }
    else if([...n.children].some(h=>ES_BLOQUE.test(h.tagName))){ out.push(...await bloques(D,n,ctx,maxPx)); }
    else { const r=await runs(D,[...n.childNodes],{},maxPx); out.push(new D.Paragraph(Object.assign(propsParrafo(D,n),{children:r}))); }
  }
  await volcar();
  return out;
}
async function lista(D,ul,ctx,nivel,maxPx){
  const out=[], ord=ul.tagName==='OL', inst=++ctx.inst;
  for(const li of [...ul.children]){
    if(li.tagName!=='LI'){ if(/^(UL|OL)$/.test(li.tagName)) out.push(...await lista(D,li,ctx,nivel+1,maxPx)); continue; }
    const propios=[...li.childNodes].filter(x=>!(x.nodeType===1&&/^(UL|OL)$/.test(x.tagName)));
    const planos=[]; propios.forEach(x=>{ if(x.nodeType===1&&/^(P|DIV)$/.test(x.tagName)) planos.push(...x.childNodes); else planos.push(x); });
    const r=await runs(D,planos,{},maxPx);
    out.push(new D.Paragraph(Object.assign(propsParrafo(D,li,{numbering:{reference:ord?'num':'vin',level:Math.min(nivel,3),instance:inst}}),{spacing:{after:60},children:r})));
    for(const sub of [...li.children].filter(x=>/^(UL|OL)$/.test(x.tagName))) out.push(...await lista(D,sub,ctx,nivel+1,maxPx));
  }
  return out;
}
async function tabla(D,tb,ctx){
  const memb=tb.classList.contains('membrete');
  const filas=[...tb.rows]; const ncol=Math.max(1,...filas.map(r=>[...r.cells].reduce((a,c)=>a+(c.colSpan||1),0)));
  let anchos=new Array(ncol).fill(Math.floor(ANCHO_TW/ncol));
  if(memb&&ncol===2) anchos=[1500,ANCHO_TW-1500];
  const NB={style:D.BorderStyle.NONE,size:0,color:'FFFFFF'}, LB={style:D.BorderStyle.SINGLE,size:6,color:'8A94A6'};
  const bordes=memb?{top:NB,bottom:NB,left:NB,right:NB}:{top:LB,bottom:LB,left:LB,right:LB};
  const rows=[];
  for(const tr of filas){
    const cells=[]; let k=0;
    for(const td of [...tr.cells]){
      const span=td.colSpan||1, w=anchos.slice(k,k+span).reduce((a,b)=>a+b,0); k+=span;
      let ch=await bloques(D,td,ctx,Math.round(ANCHO_PX*w/ANCHO_TW)-16);
      if(!ch.length) ch=[new D.Paragraph({children:[]})];
      const bg=hex(getComputedStyle(td).backgroundColor);
      cells.push(new D.TableCell({children:ch,columnSpan:span>1?span:undefined,width:{size:w,type:D.WidthType.DXA},borders:bordes,
        verticalAlign:memb?D.VerticalAlign.CENTER:undefined,
        shading:bg&&bg!=='FFFFFF'?{type:D.ShadingType.CLEAR,color:'auto',fill:bg}:undefined,
        margins:{top:60,bottom:60,left:100,right:100}}));
    }
    if(cells.length) rows.push(new D.TableRow({children:cells}));
  }
  return new D.Table({rows,width:{size:ANCHO_TW,type:D.WidthType.DXA},columnWidths:anchos,layout:D.TableLayoutType.FIXED,
    borders:memb?{top:NB,left:NB,right:NB,insideHorizontal:NB,insideVertical:NB,bottom:{style:D.BorderStyle.SINGLE,size:12,color:'1F5FBF'}}:undefined});
}

// ═════ Paginación visual: ningún bloque se queda en la separación entre folios ═════
function quitarPag(root){ root.querySelectorAll('tr.pgap').forEach(x=>x.remove());
  root.querySelectorAll('[data-pgap]').forEach(x=>{x.style.marginTop='';x.removeAttribute('data-pgap');if(!x.getAttribute('style'))x.removeAttribute('style');}); }
var _pagT=null, _pagOn=true;
function paginarLuego(){ clearTimeout(_pagT); _pagT=setTimeout(paginar,120); }
function paginar(){
  if(!_pagOn) return;
  const cs=getComputedStyle(hoja);
  quitarPag(hoja);
  if(cs.backgroundImage==='none'){ hoja.style.minHeight=''; return; }   // móvil: sin hojas
  const MM=96/25.4, STEP=309*MM, PH=297*MM;
  const mt=parseFloat(cs.paddingTop), mb=parseFloat(cs.paddingBottom), util=PH-mt-mb;
  const hr=hoja.getBoundingClientRect(), sc=(hr.height/hoja.offsetHeight)||1;
  const pos=el=>{const r=el.getBoundingClientRect(), h0=hoja.getBoundingClientRect();return {top:(r.top-h0.top)/sc,bot:(r.bottom-h0.top)/sc};};
  const bloques=[];
  [...hoja.children].forEach(el=>{
    if(el.tagName==='TABLE') [...el.rows].forEach((tr,i)=>bloques.push({el:tr,tabla:el,primera:i===0}));
    else if((el.tagName==='UL'||el.tagName==='OL')&&el.children.length) [...el.children].forEach((li,i)=>bloques.push({el:li,lista:el,primera:i===0}));
    else bloques.push({el});
  });
  let forzar=false;
  for(const b of bloques){
    const el=b.el;
    if(el.classList&&el.classList.contains('salto')){ forzar=true; continue; }
    const {top,bot}=pos(el); if(bot-top<=0&&!forzar) continue;
    const k=Math.floor(top/STEP), fin=k*STEP+PH-mb, ini=k*STEP+mt;
    let destino=null;
    if(forzar){ destino=(k+1)*STEP+mt; if(top>=ini-1&&top<=ini+2&&k>0) destino=null; forzar=false; }
    else if(top>fin-1) destino=(k+1)*STEP+mt;                        // empieza en la separación
    else if(bot>fin+0.5 && (bot-top)<=util) destino=(k+1)*STEP+mt;     // cruzaría la separación
    if(destino===null) continue;
    const dy=destino-top; if(dy<=0) continue;
    if(b.tabla&&!b.primera){                                          // fila de tabla: fila separadora
      const n=Math.max(...[...b.tabla.rows].map(r=>[...r.cells].reduce((a,c)=>a+(c.colSpan||1),0)));
      const tr=document.createElement('tr'); tr.className='pgap'; tr.contentEditable='false';
      tr.innerHTML='<td colspan="'+n+'" style="height:'+dy.toFixed(1)+'px;padding:0;border-left:0;border-right:0;background:transparent"></td>';
      el.before(tr);
    }else{
      const t=b.tabla&&b.primera?b.tabla:(b.lista&&b.primera?b.lista:el);
      const mtOrig=parseFloat(getComputedStyle(t).marginTop)||0;
      t.style.marginTop=(mtOrig+dy).toFixed(1)+'px'; t.setAttribute('data-pgap','1');
    }
  }
  const alto=hoja.scrollHeight/1, pags=Math.max(1,Math.ceil((alto+12*MM)/STEP));
  hoja.style.minHeight=(pags*STEP-12*MM).toFixed(0)+'px';
}

window.addEventListener('afterprint',()=>{_pagOn=true;paginar();});
